[package]
name = "ores-api-docs-operation-macros"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Compile-time shared-operation and HTTP-adapter attributes for ORE route-derived RPC"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }

[lints.rust]
unsafe_code = "forbid"
