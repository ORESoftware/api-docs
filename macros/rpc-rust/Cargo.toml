[package]
name = "ores-api-docs-rpc-macros"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Compile-time RPC publication markers for ORE semantic operations"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }

[lints.rust]
unsafe_code = "forbid"
