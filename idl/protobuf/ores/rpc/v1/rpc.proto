// Authored Protobuf transport projection — field numbers are release identity
// (idl/protobuf.lock.json). TypeSpec and JSON Schema/OpenAPI remain the two
// independent top-level authorities; do not generate either one from this file.

syntax = "proto3";

package ores.rpc.v1;

enum Transport {
  TRANSPORT_UNSPECIFIED = 0;
  TRANSPORT_HTTP = 1;
  TRANSPORT_TCP = 2;
  TRANSPORT_WEBSOCKET = 3;
  TRANSPORT_NATS = 4;
}

message RpcCall {
  uint32 v = 1;
  string op = 2;
  string id = 3;
  string key = 4;
  optional Transport transport = 5;
  // JSON object; proto has no untyped object. Expected delta vs Schema `object`.
  optional bytes path = 6;
  optional bytes query = 7;
  optional bytes body = 8;
  optional string trace_id = 9 [json_name = "traceId"];
  optional string span_id = 10 [json_name = "spanId"];
}

// Flattened transport projection of the TypeSpec RpcReceipt union and the JSON
// Schema if/then/else state machine. Protobuf alone cannot express that:
//   ok=true  => error absent; optional status is 200..399; body may be present
//   ok=false => error present; body absent; optional status is 400..599
// Generated Protobuf adapters must run the shared semantic validator.
message RpcReceipt {
  uint32 v = 1;
  string op = 2;
  string id = 3;
  string key = 4;
  optional Transport transport = 5;
  bool ok = 6;
  optional uint32 status = 7;
  optional bytes body = 8;
  optional bytes error = 9;
  optional string trace_id = 10 [json_name = "traceId"];
  optional string span_id = 11 [json_name = "spanId"];
}
