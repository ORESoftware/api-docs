schema = 2

[tasks.conformance]
description = "Run the canonical RPC/RIDL contract and conformance boundary"
run = ["sh conformance/check.sh"]

[tasks.test]
description = "Run the package-level release test contract"
run = ["python3 -m ridl check --root .", "python3 scripts/ridl check --root .", "python3 scripts/check-route-sync.py", "cargo run --quiet --locked --manifest-path rust/Cargo.toml --bin api-docs-check -- generate-routes --check", "python3 -m ridl.cli drift --root .", "python3 scripts/test_e2e_rpc.py", "python3 scripts/test_framing.py", "python3 scripts/test_rpc_v1_runtime.py", "python3 scripts/test_audit_rpc_v1_state.py", "python3 scripts/audit-rpc-v1-state.py", "python3 scripts/test_generated_contract.py", "cargo run --quiet --locked --manifest-path rust/Cargo.toml --bin api-docs-check -- cross-check-rpc-idl", "cargo run --quiet --locked --manifest-path rust/Cargo.toml --bin api-docs-check -- audit-rpc-idl", "cargo run --quiet --locked --manifest-path rust/Cargo.toml --bin api-docs-check -- rpc-contract-bundle --check", "python3 scripts/check-generated-contract.py --root .", "cargo test --manifest-path rust/Cargo.toml --all-features --locked", "cargo test --manifest-path clients/rust/Cargo.toml --locked", "cargo test --manifest-path runtime/rust/Cargo.toml --locked"]

[tasks.precommit]
description = "Run route sync plus staged boundary admission"
run = ["sh .githooks/pre-commit"]

[tasks.prepush]
description = "Exercise the complete Zed lifecycle before push"
run = ["sh .githooks/pre-push"]
