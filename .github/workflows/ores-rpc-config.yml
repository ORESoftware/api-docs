name: ores-rpc-config

on:
  pull_request:
    paths:
      - ".ores-rpc.toml"
      - "contracts/ores-rpc-config/**"
      - "scripts/ores_rpc_config.py"
      - "scripts/test_ores_rpc_config.py"
      - "docs/ores-rpc-config.md"
      - ".github/workflows/ores-rpc-config.yml"
  push:
    branches: [main]
    paths:
      - ".ores-rpc.toml"
      - "contracts/ores-rpc-config/**"
      - "scripts/ores_rpc_config.py"
      - "scripts/test_ores_rpc_config.py"
      - "docs/ores-rpc-config.md"
      - ".github/workflows/ores-rpc-config.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-rpc-config-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  config-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Verify exact candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run fail-closed config resolver tests
        run: |
          python3 -m unittest scripts/test_ores_rpc_config.py -v
          python3 scripts/ores_rpc_config.py check
          python3 scripts/ores_rpc_config.py normalize > /tmp/ores-rpc-config.normalized.json
          python3 scripts/ores_rpc_config.py resolve --target rust-docs-server > /tmp/ores-rpc-target.json

      - name: Require complete peer-authority mapping
        run: |
          jq -e '
            .schema == "ores.typespec-json-schema-validator.mapping/v1" and
            (.declarations | length) == 9 and
            .ignore.typespec == [] and
            .ignore.generated == [] and
            .ignore.authored == [] and
            ([.declarations[].typespec] | unique | length) == 9 and
            ([.declarations[].generated] | unique | length) == 9 and
            ([.declarations[].authored] | unique | length) == 9
          ' contracts/ores-rpc-config/tjsv.mapping.json

      - name: Compare independent TypeSpec and JSON Schema authorities
        uses: ORESoftware/typespec-json-schema-validator@d60d0d79d83e075077382623ec9e23a401ab601f
        with:
          typespec: contracts/ores-rpc-config/typespec/main.tsp
          schema: contracts/ores-rpc-config/json-schema/ores-rpc-config.schema.json
          mapping: contracts/ores-rpc-config/tjsv.mapping.json
          report: .typespec-json-schema-validator/ores-rpc-config/report.json
          sarif: .typespec-json-schema-validator/ores-rpc-config/report.sarif
          contract_ir: .typespec-json-schema-validator/ores-rpc-config/contract-ir.json
          output_dir: .typespec-json-schema-validator/ores-rpc-config/generated
          int64_strategy: number
          quiet: "false"

      - name: Require peer authorities and non-authoritative Contract IR
        run: |
          jq -e '
            .schema == "ores.typespec-json-schema-validator.report/v1" and
            .status == "passed" and
            .zeroUnexplainedFindings == true and
            .authorities.precedence == "none" and
            .authorities.typespec.authority == "independently-authored" and
            .authorities.jsonSchema.authority == "independently-authored" and
            .authorities.typespec.generatedJsonSchemaRole == "comparison-evidence-only" and
            (.differential.summary.divergences // 0) == 0 and
            (.differential.summary.refusals // 0) == 0
          ' .typespec-json-schema-validator/ores-rpc-config/report.json
          jq -e '
            .schema == "ores.typespec-json-schema-validator.contract-ir/v1" and
            .status == "passed" and
            .admissible == true and
            .role == "downstream-derived-parity-artifact" and
            .editableAuthority == false
          ' .typespec-json-schema-validator/ores-rpc-config/contract-ir.json

      - name: Prove authored and semantic sources were not rewritten
        run: |
          git diff --exit-code -- \
            .ores-rpc.toml \
            contracts/ores-rpc-config \
            scripts/ores_rpc_config.py \
            scripts/test_ores_rpc_config.py \
            docs/ores-rpc-config.md

      - name: Retain deterministic TJSV evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ores-rpc-config-${{ github.event.pull_request.head.sha || github.sha }}
          path: .typespec-json-schema-validator/ores-rpc-config
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
