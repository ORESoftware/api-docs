name: export RPC audit snapshot

on:
  push:
    branches:
      - harden/rpc-idl-dual-primary
    paths:
      - .github/workflows/export-rpc-audit-snapshot.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact branch source
        uses: actions/upload-artifact@v4
        with:
          name: rpc-audit-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
