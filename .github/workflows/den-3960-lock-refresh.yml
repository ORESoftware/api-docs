name: DEN-3960 lock refresh

on:
  push:
    branches: [DEN-3960-rust-fs-routing]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: DEN-3960-rust-fs-routing
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
      - name: Regenerate root Cargo.lock
        run: cargo generate-lockfile
      - name: Commit generated lock and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-3960-lock-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock .github/workflows/den-3960-lock-refresh.yml
          git diff --cached --quiet && exit 0
          git commit -m 'DEN-3960 refresh Cargo lock after macro workspace changes'
          git push origin HEAD:DEN-3960-rust-fs-routing
