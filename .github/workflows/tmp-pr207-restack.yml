name: tmp-pr207-restack

on:
  push:
    branches:
      - feat/web-page-docs-writer-render-chain-20260920
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restack-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out writer branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/web-page-docs-writer-render-chain-20260920
          fetch-depth: 0
          persist-credentials: true
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Merge current main and expose writer module
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "ORESoftware automation"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-commit --no-ff -X theirs origin/main
          python3 <<'PY'
          from pathlib import Path
          p = Path('rust/src/lib.rs')
          text = p.read_text()
          if 'pub mod page_docs;' not in text:
              needle = 'pub mod page_build;\n'
              if text.count(needle) != 1:
                  raise SystemExit('expected exactly one page_build module declaration')
              text = text.replace(needle, needle + 'pub mod page_docs;\n', 1)
          p.write_text(text)
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
      - name: Verify writer and repository Rust surface
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/Cargo.toml page_docs --locked
          cargo test --manifest-path rust/Cargo.toml page_manifest --locked
          cargo test --manifest-path rust/Cargo.toml page_layout --locked
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Commit verified restack
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "feat(web): restack page docs writer on current main"
          git push origin HEAD:feat/web-page-docs-writer-render-chain-20260920
