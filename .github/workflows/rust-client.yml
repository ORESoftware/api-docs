name: rust-client

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'clients/rust/**'
      - 'rust/**'
      - 'json-schema/**'
      - 'Cargo.lock'
      - '.github/workflows/rust-client.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
      - name: Install pinned Rust and review tools
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Bootstrap missing lock for review, never for promotion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/rust-client/review
          if ! test -f clients/rust/Cargo.lock; then
            cp Cargo.lock clients/rust/Cargo.lock
            cargo check --manifest-path clients/rust/Cargo.toml
          fi
          cargo fmt --manifest-path clients/rust/Cargo.toml
      - name: Test the standalone consumer with locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path clients/rust/Cargo.toml --locked 2>&1 | tee tmp/rust-client/tests.log
          cargo clippy --manifest-path clients/rust/Cargo.toml --all-targets --locked -- -D warnings
          cargo tree --manifest-path clients/rust/Cargo.toml --locked --edges normal --prefix none > tmp/rust-client/dependencies.txt
          if grep -Eq '^axum v' tmp/rust-client/dependencies.txt; then
            echo 'The standalone client unexpectedly enables Axum' >&2
            exit 1
          fi
      - name: Retain exact lock and source review evidence
        if: always()
        shell: bash
        run: |
          mkdir -p tmp/rust-client/review
          for file in Cargo.lock src/lib.rs tests/client.rs; do
            if test -f "clients/rust/$file"; then
              mkdir -p "tmp/rust-client/review/$(dirname "$file")"
              cp "clients/rust/$file" "tmp/rust-client/review/$file"
            fi
          done
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > tmp/rust-client/source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rust-client-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp/rust-client/
          retention-days: 3
          if-no-files-found: error
      - name: Require reviewed lock and formatting at exact head
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch clients/rust/Cargo.lock
          git diff --exit-code -- clients/rust
