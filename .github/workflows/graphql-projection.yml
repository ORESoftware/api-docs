name: graphql-rpc-projection

on:
  pull_request:
    paths:
      - 'macros/graphql-rust/**'
      - 'macros/rpc-rust/**'
      - 'contracts/graphql-projection/**'
      - 'rust/src/graphql_projection.rs'
      - 'rust/src/lib.rs'
      - 'docs/graphql-projection.md'
      - 'docs/rpc-publication.md'
      - 'Cargo.toml'
  push:
    branches: [main]
    paths:
      - 'macros/graphql-rust/**'
      - 'macros/rpc-rust/**'
      - 'contracts/graphql-projection/**'
      - 'rust/src/graphql_projection.rs'
      - 'rust/src/lib.rs'
      - 'docs/graphql-projection.md'
      - 'docs/rpc-publication.md'
      - 'Cargo.toml'

permissions:
  contents: read

jobs:
  graphql-macro:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
      - name: Test GraphQL resolver macro
        run: cargo test --manifest-path macros/graphql-rust/Cargo.toml
      - name: Test typed GraphQL projection descriptor
        run: cargo test --locked --manifest-path rust/Cargo.toml graphql_projection::tests

  rpc-publication-macros:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
      - run: cargo test --manifest-path macros/rpc-rust/Cargo.toml

  contract-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          package-manager-cache: false
      # GraphQL authority parity must be established by compiler-backed TJSV,
      # not by a few literal-string checks against the JSON Schema alone.
      - name: Compare independently authored GraphQL TypeSpec and JSON Schema
        uses: ORESoftware/typespec-json-schema-validator@d776d54d7138bb199ed86d550e22b1570536f4df
        with:
          typespec: contracts/graphql-projection/graphql-projection.tsp
          schema: contracts/graphql-projection/graphql-projection.schema.json
          report: .typespec-json-schema-validator/graphql-projection/report.json
          contract_ir: .typespec-json-schema-validator/graphql-projection/contract-ir.json
          output_dir: .typespec-json-schema-validator/graphql-projection/generated
          max_probes: "128"
      - name: Require zero unexplained GraphQL divergence and executable differential probes
        run: |
          set -euo pipefail
          jq -e '
            .schema == "ores.typespec-json-schema-validator.report/v1" and
            .status == "passed" and
            .zeroUnexplainedFindings == true and
            (.findings | length) == 0 and
            .authorities.precedence == "none" and
            (.differential.summary.probesEvaluated // 0) > 0 and
            (.differential.summary.divergences // -1) == 0 and
            (.differential.summary.refusals // -1) == 0
          ' .typespec-json-schema-validator/graphql-projection/report.json
          jq -e '
            .schema == "ores.typespec-json-schema-validator.contract-ir/v1" and
            .status == "passed" and .admissible == true and
            .editableAuthority == false
          ' .typespec-json-schema-validator/graphql-projection/contract-ir.json
      - name: Preserve authored GraphQL authorities
        run: git diff --exit-code -- contracts/graphql-projection
      - run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('contracts/graphql-projection/graphql-projection.schema.json', 'utf8'));
          if (s.properties.endpoint.const !== '/v1/graphql') process.exit(1);
          if (s.properties.authority.const !== 'resolver.rs') process.exit(1);
          const p = s.$defs.operation.properties;
          const authorities = JSON.stringify(p.semantic_authority.enum);
          if (authorities !== JSON.stringify(['handlers.rs', 'funcs.rs'])) process.exit(1);
          if (p.semantic_source.pattern !== '^src/(?:routes/rest/.+/handlers|rpc/.+/funcs)\\.rs$') process.exit(1);
          if (p.graphql_source.pattern !== '^src/graphql/(?:.+/)?resolver\\.rs$') process.exit(1);
          NODE
