# One-use finalizer on a previously registered workflow path.
name: apply final RPC authority model

on:
  push:
    branches:
      - harden/rpc-idl-dual-primary
    paths:
      - .github/workflows/apply-rpc-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-final-rpc-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: harden/rpc-idl-dual-primary
          fetch-depth: 0

      - name: Reconcile authority language without discarding concurrent work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"{path}: missing start marker {start!r}")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"{path}: missing end marker {end!r}")
              file.write_text(
                  text[:start_index] + replacement.rstrip() + "\n\n" + text[end_index:],
                  encoding="utf-8",
              )

          replace_between(
              "AGENTS.md",
              "JSON Schema in `json-schema/`",
              "Two stacks share this repo; do not mix their frames:",
              '''For shared RPC envelope vocabulary, TypeSpec in `idl/typespec/` is the
          **P0 semantic and wire authority**. JSON Schema in `json-schema/` is the **P1
          runtime-admission projection/profile**; it preserves closed-world and conditional
          validation and may veto a release when it drifts, but it must not redefine P0.
          Protobuf in `idl/protobuf/` is the **P2 binary/streaming projection and
          field-number compatibility ledger**; it may veto reuse or drift, but it also must
          not redefine P0. Per-service route-map JSON instances remain the canonical
          operation inventory consumed by the digest-bound bundle.

          Projections stay committed and independently reviewed while current emitters cannot
          reproduce every checked semantic exactly. Begin a shared-envelope change in
          TypeSpec, reconcile the JSON Schema and Protobuf projections in the same PR, and
          document only intentional lossy edges in `idl/expected-deltas.json`.
          `scripts/cross-check-rpc-idl.py` and `scripts/audit-rpc-idl.py` fail closed on
          absent constraints, unparsed Proto fields, enum-ledger drift, unknown declarations,
          and undeclared deltas. Never edit a projection merely to silence a gate.''',
          )

          replace_between(
              "README.md",
              "## Independent TypeSpec, JSON Schema, and Protobuf primaries",
              "## Same v1 envelope on every transport",
              '''## TypeSpec authority with checked JSON Schema and Protobuf projections

          Shared RPC frame semantics originate in the authoritative TypeSpec model
          (`idl/typespec/`). TypeSpec uses backticks for reserved wire identifiers such as
          `` `op` ``. JSON Schema (`json-schema/`) is the committed runtime-admission
          projection/profile, and Protobuf (`idl/protobuf/`) is the committed binary/streaming
          projection plus field-number compatibility ledger.

          Both projections are release vetoes when they drift, omit a required semantic, or
          reuse compatibility state, but neither may redefine TypeSpec. They remain committed
          and independently reviewed because current emitters and proto3 cannot reproduce every
          checked closed-world, conditional, and compatibility edge exactly. A shared-envelope
          change begins in TypeSpec and reconciles both projections in the same PR.

          `scripts/cross-check-rpc-idl.py` performs the structural comparison.
          `scripts/audit-rpc-idl.py` adds strict semantic admission:

          - an absent constraint is a mismatch, not “not comparable”;
          - expected representation loss is an exact allow-list in
            [`idl/expected-deltas.json`](idl/expected-deltas.json);
          - every Proto assignment must be parsed;
          - field numbers must be positive, unique, and present in the ledger;
          - enum values must match the ledger;
          - the TypeSpec declaration set and reviewed cross-model references are closed.

          Unexpected drift is a veto. A future emitter may write candidates only below
          `generated/idl/projections/`; it must never overwrite a reviewed release projection
          merely to force a green diff.''',
          )

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace(
              "- `json-schema/` — authored RPC, route-map, projection, binding, and runtime contracts\n"
              "- `idl/` — TypeSpec, Protobuf, expected deltas, Buf policy, and field-number lock",
              "- `json-schema/` — P1 runtime projections, route-map admission, bindings, and validation profiles\n"
              "- `idl/` — P0 authoritative TypeSpec, P2 Protobuf projection, reviewed deltas, Buf policy, and field-number lock",
          )
          text = text.replace(
              "JSON Schema remains the route-map contract. `scripts/check-route-sync.py` fails",
              "`json-schema/route-map.schema.json` remains the admission contract for route-map instances. `scripts/check-route-sync.py` fails",
          )
          readme.write_text(text, encoding="utf-8")

          Path("idl/README.md").write_text('''# RPC IDL authority and checked projections

There is one authority for shared RPC envelope semantics and two committed,
release-vetoing projections. This avoids both silent generator loss and three
competing sources of truth.

| Tier | Source | Role |
| --- | --- | --- |
| **P0** | TypeSpec in `idl/typespec/` | Semantic and wire authority for shared fields, constraints, unions, and enums |
| **P1** | JSON Schema in `json-schema/` | Runtime-admission projection/profile, including closed-world and conditional validation |
| **P2** | Protobuf in `idl/protobuf/` | Binary/streaming projection plus stable field-number compatibility ledger |

P1 and P2 can veto a release when they drift, omit a required semantic, or
reuse compatibility state. They cannot originate a conflicting semantic or
overrule P0. They remain committed and independently reviewed because current
emitters do not preserve every checked JSON Schema and proto3 edge exactly.
Intentional representation loss is an explicit allow-list in
`idl/expected-deltas.json`; it is never a blanket exemption.

Per-service route-map JSON instances remain the canonical operation inventory
for the digest-bound API-document and language bundle. `declarative-migrations`
(`dpm`) is the SQL apply engine, not an RPC author. This crate does not open
NATS, opto-sync, or ores-otel.

## Do not mix stacks

- v1 unary: `rpc-call` / `rpc-receipt` (`op`)
- v2 RIDL: `rpc-frame` (`t`)
- HTTP never uses the v2 envelope; HTTP already supplies method, path, headers,
  status, and body framing

## Change workflow

1. Change the shared semantic fact in TypeSpec first.
2. Reconcile the JSON Schema runtime profile and, when binary identity is
   affected, the Protobuf projection in the same PR.
3. Run the structural and strict semantic gates.
4. Fix unexpected drift. Add an expected delta only for a reviewed,
   representation-specific loss that cannot be encoded faithfully.
5. Append new Protobuf field numbers in `idl/protobuf.lock.json`; never reuse or
   renumber a released field.

```sh
npm --prefix idl/typespec ci
npm --prefix idl/typespec run compile
buf format --diff --exit-code idl/protobuf
buf lint idl/protobuf
python3 scripts/test_cross_check_rpc_idl.py -v
python3 scripts/cross-check-rpc-idl.py
python3 scripts/test_audit_rpc_idl.py -v
python3 scripts/audit-rpc-idl.py
```

A future TypeSpec emitter may write candidate artifacts only below
`generated/idl/projections/`. Promotion into `json-schema/` or `idl/protobuf/`
requires semantic equivalence under both gates, stable output, and human review;
an emitter must never overwrite a release projection merely to make CI green.
''', encoding="utf-8")

          replace_between(
              "docs/rpc-contract-coupling.md",
              "TypeSpec, JSON Schema Draft 2020-12, and Protobuf are independently authored",
              "Reserved TypeSpec property identifiers",
              '''TypeSpec is the semantic and wire authority for shared RPC envelopes. JSON
          Schema Draft 2020-12 is the committed runtime-admission projection/profile, and
          Protobuf is the committed binary/streaming projection plus field-number ledger.
          The projections are release vetoes when they drift, but they cannot redefine the
          TypeSpec authority. They remain reviewed in source control while current emitters
          cannot preserve every closed-world, conditional, and proto3 compatibility edge.
          Generation must never be used merely to make a drift check green.''',
          )

          script = Path("scripts/cross-check-rpc-idl.py")
          text = script.read_text(encoding="utf-8")
          text = text.replace(
              '"""Cross-check independently authored RPC primaries.\n\nTypeSpec (P0), JSON Schema (P1), and Protobuf (P2) are all human-authored.\nThis gate extracts a structural fingerprint from each and diffs them. Known\nlossy edges live in idl/expected-deltas.json. Anything else is a release veto.\n\nDoes not compile TypeSpec, open sockets, or depend on opto-sync / ores-otel.\n"""',
              '"""Cross-check authoritative RPC IDL against committed projections.\n\nTypeSpec is the P0 semantic/wire authority. JSON Schema is the P1 runtime\nprojection/profile, and Protobuf is the P2 binary projection and field-number\nledger. This gate extracts structural fingerprints and fails on unreviewed drift.\nKnown representation loss lives in idl/expected-deltas.json.\n\nDoes not compile TypeSpec, open sockets, or depend on opto-sync / ores-otel.\n"""',
          )
          text = text.replace(
              'rpc idl dual-primary veto',
              'rpc idl authority/projection veto',
          )
          script.write_text(text, encoding="utf-8")

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text(encoding="utf-8")
          text = text.replace(
              "Compile the authored TypeSpec primary",
              "Compile the authoritative TypeSpec model",
          )
          text = text.replace(
              "Check dual-primary and strict IDL admission",
              "Check authority/projection drift and strict IDL admission",
          )
          ci.write_text(text, encoding="utf-8")
          PY

          python3 scripts/test_cross_check_rpc_idl.py -v
          python3 scripts/cross-check-rpc-idl.py
          python3 scripts/test_audit_rpc_idl.py -v
          python3 scripts/audit-rpc-idl.py

          rm -f .github/workflows/apply-rpc-hardening.yml
          rm -f .github/workflows/finalize-rpc-authority.yml
          git diff --check

      - name: Commit exact reconciled tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(rpc): establish TypeSpec authority and checked projections'
          git push origin HEAD:harden/rpc-idl-dual-primary
