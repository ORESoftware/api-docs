# One-use finalizer. This workflow deletes itself after committing the runtime lock.
name: finalize RPC hardening branch

on:
  push:
    branches:
      - harden/rpc-idl-dual-primary
    paths:
      - .github/workflows/apply-rpc-hardening.yml

permissions:
  contents: write

concurrency:
  group: finalize-rpc-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: harden/rpc-idl-dual-primary
          fetch-depth: 0

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0

      - name: Generate and verify the runtime lockfile
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path runtime/rust/Cargo.toml
          cargo test --manifest-path runtime/rust/Cargo.toml --locked

      - name: Remove one-use audit and bootstrap files
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-rpc-hardening.yml
          rm -f .github/workflows/export-rpc-audit-snapshot.yml
          rm -f .rpc-audit/source.05
          rmdir .rpc-audit 2>/dev/null || true
          git diff --check

      - name: Commit the exact final tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(rpc): lock runtime and remove bootstrap artifacts'
          git push origin HEAD:harden/rpc-idl-dual-primary
