name: apply RPC hardening payload

on:
  push:
    branches:
      - harden/rpc-idl-dual-primary
    paths:
      - .github/workflows/apply-rpc-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-rpc-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: harden/rpc-idl-dual-primary
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Verify and apply the source-only patch
        run: |
          set -euo pipefail
          cat .rpc-audit/source.0* > "$RUNNER_TEMP/rpc-source.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/rpc-source.patch.gz.b64" > "$RUNNER_TEMP/rpc-source.patch.gz"
          printf '%s  %s\n' \
            57ba1904b69317820d67d6fea48dedbc6393ff0aa0f704e2897f6621eff58152 \
            "$RUNNER_TEMP/rpc-source.patch.gz" | sha256sum --check --strict
          gunzip --stdout "$RUNNER_TEMP/rpc-source.patch.gz" > "$RUNNER_TEMP/rpc-source.patch"
          git apply --check "$RUNNER_TEMP/rpc-source.patch"
          git apply "$RUNNER_TEMP/rpc-source.patch"
          git diff --check
      - name: Generate deterministic dependency locks
        run: |
          set -euo pipefail
          npm install --prefix idl/typespec --ignore-scripts --no-audit --no-fund
          cargo generate-lockfile
      - name: Compile authored TypeSpec and regenerate all projections
        run: |
          set -euo pipefail
          npm run compile --prefix idl/typespec
          python3 scripts/generate-routes.py
          python3 -m ridl.cli generate --root .
      - name: Run deterministic RPC contract gates
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'jsonschema==4.26.0'
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/cross-check-rpc-idl.py
          python3 scripts/check-rpc-docs-coupling.py --root .
          python3 scripts/check-generated-contract.py --self-test
          python3 scripts/check-generated-contract.py --freeze --require-readonly
          python3 scripts/check-route-sync.py
          python3 scripts/generate-routes.py --check
          python3 -m ridl.cli check --root .
          python3 -m ridl.cli drift --root .
      - name: Compile and test Rust documentation and generated bindings
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo test --workspace --all-features --locked
          cargo clippy -p ores-api-docs --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path runtime/rust/Cargo.toml --locked
      - name: Commit exact generated tree and locks
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(rpc): couple docs to generated language contracts'
          git push origin HEAD:harden/rpc-idl-dual-primary
