name: temporary finalize Rust checker

on:
  push:
    branches:
      - hardening/rust-checker-migration-20260915

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event.head_commit.message == 'ci: stage final api-docs fixes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/rust-checker-migration-20260915
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install Go 1.24
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24.7"
          cache: false

      - name: Patch checker test-only boundaries and Go formatter stability
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/patch.rs" <<'RS'
          use std::fs;

          fn replace_once(path: &str, from: &str, to: &str) {
              let mut text = fs::read_to_string(path).unwrap_or_else(|e| panic!("{path}: {e}"));
              let count = text.matches(from).count();
              assert_eq!(count, 1, "{path}: expected exactly one match for {from:?}, got {count}");
              text = text.replacen(from, to, 1);
              fs::write(path, text).unwrap_or_else(|e| panic!("{path}: {e}"));
          }

          fn main() {
              replace_once(
                  "rust/src/bin/api_docs_check/authority.rs",
                  "use std::fs;\n",
                  "#[cfg(test)]\nuse std::fs;\n",
              );
              replace_once(
                  "rust/src/bin/api_docs_check/common.rs",
                  "pub fn copy_tree(source: &Path, destination: &Path) -> CheckResult<()> {",
                  "#[cfg(test)]\npub fn copy_tree(source: &Path, destination: &Path) -> CheckResult<()> {",
              );
              replace_once(
                  "rust/src/bin/api_docs_check/routes.rs",
                  "    pub fn to_json(&self) -> Value {",
                  "    #[cfg(test)]\n    pub fn to_json(&self) -> Value {",
              );
              replace_once(
                  "rust/src/bin/api_docs_check/bundle.rs",
                  "        route_names.push(format!(\"Route{identifier}\"));\n    }\n    let mut lines = vec![",
                  "        route_names.push(format!(\"Route{identifier}\"));\n    }\n    let route_name_width = route_names.iter().map(String::len).max().unwrap_or(0);\n    let mut lines = vec![",
              );
              replace_once(
                  "rust/src/bin/api_docs_check/bundle.rs",
                  "            \"\\t{route_name} RouteKey = {}\",\n            json_string_literal(operation[\"key\"].as_str().unwrap_or_default())?\n",
                  "            \"\\t{route_name:<width$} RouteKey = {}\",\n            json_string_literal(operation[\"key\"].as_str().unwrap_or_default())?,\n            width = route_name_width\n",
              );
              for (from, to) in [
                  ("\"\\tKey RouteKey\".to_owned()", "\"\\tKey               RouteKey\".to_owned()"),
                  ("\"\\tPath string\".to_owned()", "\"\\tPath              string\".to_owned()"),
                  ("\"\\tMethods []string\".to_owned()", "\"\\tMethods           []string\".to_owned()"),
                  ("\"\\tTransports []string\".to_owned()", "\"\\tTransports        []string\".to_owned()"),
                  ("\"\\tTCPFraming string\".to_owned()", "\"\\tTCPFraming        string\".to_owned()"),
                  ("\"\\tDelivery string\".to_owned()", "\"\\tDelivery          string\".to_owned()"),
                  ("\"\\tAliasOf string\".to_owned()", "\"\\tAliasOf           string\".to_owned()"),
                  ("\"\\tOptoSyncTable string\".to_owned()", "\"\\tOptoSyncTable     string\".to_owned()"),
                  ("format!(\"\\t\\tKey: {route_name},\")", "format!(\"\\t\\tKey:               {route_name},\")"),
                  ("format!(\"\\t\\tPath: {},\"", "format!(\"\\t\\tPath:              {},\""),
                  ("format!(\"\\t\\tMethods: []string{{{methods}}},\")", "format!(\"\\t\\tMethods:           []string{{{methods}}},\")"),
                  ("format!(\"\\t\\tTransports: []string{{{transports}}},\")", "format!(\"\\t\\tTransports:        []string{{{transports}}},\")"),
                  ("\"\\t\\tTCPFraming: {},\"", "\"\\t\\tTCPFraming:        {},\""),
                  ("\"\\t\\tDelivery: {},\"", "\"\\t\\tDelivery:          {},\""),
                  ("\"\\t\\tAliasOf: {},\"", "\"\\t\\tAliasOf:           {},\""),
                  ("\"\\t\\tOptoSyncTable: {},\"", "\"\\t\\tOptoSyncTable:     {},\""),
              ] {
                  replace_once("rust/src/bin/api_docs_check/bundle.rs", from, to);
              }
          }
          RS
          rustc --edition 2021 "$RUNNER_TEMP/patch.rs" -o "$RUNNER_TEMP/patch"
          "$RUNNER_TEMP/patch"
          cargo fmt --all

      - name: Certify exact patched tree
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --bin api-docs-check --all-features --locked -- -D warnings
          cargo test --locked --manifest-path rust/Cargo.toml --all-features
          bundle="$RUNNER_TEMP/rpc-contract-bundle"
          cargo run --quiet --locked --manifest-path rust/Cargo.toml --bin api-docs-check -- rpc-contract-bundle --out "$bundle" --check
          while IFS= read -r go_mod; do
            (
              cd "$(dirname "$go_mod")"
              gofmt -d routes.go > "$RUNNER_TEMP/gofmt.diff"
              if test -s "$RUNNER_TEMP/gofmt.diff"; then
                cat "$RUNNER_TEMP/gofmt.diff" >&2
                exit 1
              fi
              go test ./...
            )
          done < <(find "$bundle" -name go.mod -type f -print | sort)
          cargo run --quiet --locked --manifest-path rust/Cargo.toml --bin api-docs-check -- all
          git diff --check

      - name: Publish source fixes
        shell: bash
        run: |
          set -euo pipefail
          git add rust/src/bin/api_docs_check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: finish Rust checker migration certification"
          git push origin HEAD:hardening/rust-checker-migration-20260915
