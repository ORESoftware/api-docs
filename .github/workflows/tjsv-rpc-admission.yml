name: TJSV RPC v1 admission

on:
  pull_request:
    paths:
      - '.ores-rpc.toml'
      - 'contracts/ores-rpc-config/**'
      - 'scripts/check-ores-rpc-config.py'
      - 'scripts/test-ores-rpc-config.py'
      - 'scripts/tjsv-*.mjs'
      - 'scripts/test_tjsv_*.mjs'
      - 'scripts/test-tjsv-*.mjs'
      - 'scripts/projection-evidence-io.mjs'
      - 'scripts/test-projection-evidence-io.mjs'
      - 'runtime/**'
      - 'examples/rpc-v1/**'
      - 'examples/opto-sync/**'
      - 'json-schema/**'
      - 'idl/**'
      - 'clients/**'
      - 'rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - '.zpkg.toml'
      - '.github/workflows/tjsv-rpc-admission.yml'
  push:
    branches: [main]
    paths:
      - '.ores-rpc.toml'
      - 'contracts/ores-rpc-config/**'
      - 'scripts/check-ores-rpc-config.py'
      - 'scripts/test-ores-rpc-config.py'
      - 'scripts/tjsv-*.mjs'
      - 'scripts/test_tjsv_*.mjs'
      - 'scripts/test-tjsv-*.mjs'
      - 'scripts/projection-evidence-io.mjs'
      - 'scripts/test-projection-evidence-io.mjs'
      - 'runtime/**'
      - 'examples/rpc-v1/**'
      - 'examples/opto-sync/**'
      - 'json-schema/**'
      - 'idl/**'
      - 'clients/**'
      - 'rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - '.zpkg.toml'
      - '.github/workflows/tjsv-rpc-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tjsv-rpc-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tjsv-rpc-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
      - name: Check out reviewed TJSV implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: d60d0d79d83e075077382623ec9e23a401ab601f
          path: tmp/tjsv
          persist-credentials: false
          show-progress: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Install Rust for the actual client oracle
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
      - name: Install Go for the additional native admission oracle
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install Python for the existing independent-authority gates
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install TJSV's exact locked dependencies and explicit native f2e addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tmp/tjsv --ignore-scripts --no-audit --no-fund
          npm rebuild --prefix tmp/tjsv @oresoftware/f2e --ignore-scripts=false --no-audit --no-fund
          test -s tmp/tjsv/node_modules/@oresoftware/f2e/clients/nodejs/build/Release/flags2env.node
      - name: Run adversarial harness, Go/Rust adapters, entrypoint, source-integrity and receipt-IO regressions
        run: node --test scripts/test_tjsv_rpc_admission.mjs scripts/test_tjsv_rust_admission.mjs scripts/test_tjsv_go_admission.mjs scripts/test_tjsv_rpc_runtime_protocol.mjs scripts/test-tjsv-rpc-entrypoint.mjs scripts/test-projection-evidence-io.mjs
      - name: Test the Rust adapter independently of the comparison harness
        run: cargo test --locked --manifest-path clients/rust/Cargo.toml --example tjsv_admission
      - name: Test the Go client and shared probe independently
        working-directory: clients/go
        env:
          GOENV: off
          GOWORK: off
          GOTOOLCHAIN: local
          GOPROXY: off
        run: |
          go vet ./...
          go test -race ./...
          go build -trimpath -buildvcs=false -o ../../tmp/tjsv-probes/go-base-check ./testdata/tjsv_probe
      - name: Check the existing peer-authority and receipt-state rules
        run: |
          python3 scripts/cross-check-rpc-idl.py
          python3 scripts/audit-rpc-idl.py
          python3 scripts/audit-rpc-v1-state.py
      - name: Admit .ores-rpc.toml semantics and peer authorities
        run: |
          python3 -m unittest scripts/test-ores-rpc-config.py -v
          python3 scripts/check-ores-rpc-config.py
          node tmp/tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec=contracts/ores-rpc-config/main.tsp \
            --schema=contracts/ores-rpc-config/authored.schema.json \
            --instances=tmp/ores-rpc-config-instances \
            --report=tmp/ores-rpc-config-tjsv.json \
            --quiet
      - name: Compare TJSV verdicts with real TypeScript, Rust and Go client decoders
        run: node scripts/tjsv-rpc-admission.mjs
      - name: Locked oracle builds must not rewrite dependency evidence
        run: git diff --exit-code -- Cargo.lock clients/go/go.mod
      - name: Retain exact-source receipt
        if: ${{ always() && hashFiles('tmp/tjsv-rpc-admission.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tjsv-rpc-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/tjsv-rpc-admission.json
            tmp/ores-rpc-config-tjsv.json
            tmp/ores-rpc-config-instances/OresRpcConfig/valid/api-docs.json
          if-no-files-found: error
          retention-days: 14
