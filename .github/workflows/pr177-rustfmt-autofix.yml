name: PR177 rustfmt autofix

on:
  push:
    branches:
      - draft/web-server-page-boundary-20260919

permissions:
  contents: write

jobs:
  rustfmt:
    if: ${{ !contains(github.event.head_commit.message, '[rustfmt-autofix]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install Rust 1.95.0 with rustfmt
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply repository rustfmt
        run: cargo fmt --all

      - name: Commit formatter-only diff
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No rustfmt diff."
            exit 0
          fi
          git diff --check
          git config user.name "ORESoftware rustfmt bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m 'style: apply rustfmt to PR177 [rustfmt-autofix]'
          git push origin HEAD:refs/heads/draft/web-server-page-boundary-20260919
