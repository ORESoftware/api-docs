name: server-compatibility-receipt

on:
  pull_request:
    paths:
      - "contracts/server-compatibility-receipt/**"
      - "scripts/check-server-compatibility-receipt.py"
      - ".github/workflows/server-compatibility-receipt.yml"
  push:
    branches: [main]
    paths:
      - "contracts/server-compatibility-receipt/**"
      - "scripts/check-server-compatibility-receipt.py"
      - ".github/workflows/server-compatibility-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-authority-and-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compare independent TypeSpec and JSON Schema authorities
        uses: ORESoftware/typespec-json-schema-validator@813d5f021e02574f529a9553b670719f8f10d02c
        with:
          typespec: contracts/server-compatibility-receipt/typespec/main.tsp
          schema: contracts/server-compatibility-receipt/json-schema/server-compatibility-receipt.schema.json
          mapping: contracts/server-compatibility-receipt/tjsv.mapping.json
          instances: contracts/server-compatibility-receipt/instances
          report: .typespec-json-schema-validator/server-compatibility/report.json
          contract_ir: .typespec-json-schema-validator/server-compatibility/contract-ir.json
          output_dir: .typespec-json-schema-validator/server-compatibility/generated
          int64_strategy: number
          quiet: "false"

      - name: Require reviewed corpus evidence and peer-authority parity
        run: |
          set -euo pipefail
          jq -e '
            .schema == "ores.typespec-json-schema-validator.report/v1" and
            .status == "passed" and
            .zeroUnexplainedFindings == true and
            .authorities.precedence == "none" and
            (.findings | length) == 0 and
            (.differential.summary.reviewedAcceptedInstances // 0) >= 1 and
            (.differential.summary.reviewedRejectedInstances // 0) >= 1
          ' .typespec-json-schema-validator/server-compatibility/report.json

      - name: Exercise cross-field receipt policy
        run: python3 scripts/check-server-compatibility-receipt.py --self-test

      - name: Prove authored authorities were not rewritten
        run: git diff --exit-code -- contracts/server-compatibility-receipt
