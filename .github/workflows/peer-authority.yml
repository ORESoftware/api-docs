name: peer-authority

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/rpc-contract-coupling.md"
      - "idl/**"
      - "json-schema/**"
      - "rust/src/bin/api-docs-check.rs"
      - "rust/src/bin/api_docs_check/**"
      - "scripts/compare-authority-artifacts.py"
      - "scripts/test_compare_authority_artifacts.py"
      - "scripts/validate-authority-contract.py"
      - "scripts/test_validate_authority_contract.py"
      - ".github/workflows/peer-authority.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/rpc-contract-coupling.md"
      - "idl/**"
      - "json-schema/**"
      - "rust/src/bin/api-docs-check.rs"
      - "rust/src/bin/api_docs_check/**"
      - "scripts/compare-authority-artifacts.py"
      - "scripts/test_compare_authority_artifacts.py"
      - "scripts/validate-authority-contract.py"
      - "scripts/test_validate_authority_contract.py"
      - ".github/workflows/peer-authority.yml"

permissions:
  contents: read

concurrency:
  group: peer-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-and-discrepancy-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0

      - name: Validate unordered peer authorities
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml --bin api-docs-check authority::tests
          cargo run --quiet --locked --manifest-path rust/Cargo.toml --bin api-docs-check -- validate-authority-contract

      - name: Preserve existing RPC semantic cross-check
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path rust/Cargo.toml --bin api-docs-check -- cross-check-rpc-idl
          cargo run --quiet --locked --manifest-path rust/Cargo.toml --bin api-docs-check -- audit-rpc-idl
