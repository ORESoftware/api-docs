name: peer-authority

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/rpc-contract-coupling.md"
      - "idl/**"
      - "json-schema/**"
      - "scripts/compare-authority-artifacts.py"
      - "scripts/test_compare_authority_artifacts.py"
      - "scripts/validate-authority-contract.py"
      - "scripts/test_validate_authority_contract.py"
      - ".github/workflows/peer-authority.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/rpc-contract-coupling.md"
      - "idl/**"
      - "json-schema/**"
      - "scripts/compare-authority-artifacts.py"
      - "scripts/test_compare_authority_artifacts.py"
      - "scripts/validate-authority-contract.py"
      - "scripts/test_validate_authority_contract.py"
      - ".github/workflows/peer-authority.yml"

permissions:
  contents: read

concurrency:
  group: peer-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-and-discrepancy-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate unordered peer authorities
        run: |
          set -euo pipefail
          python3 scripts/test_validate_authority_contract.py -v
          python3 scripts/validate-authority-contract.py

      - name: Prove SQL, type, and ORM discrepancy halts
        run: |
          set -euo pipefail
          python3 scripts/test_compare_authority_artifacts.py -v

      - name: Preserve existing RPC semantic cross-check
        run: |
          set -euo pipefail
          python3 scripts/test_cross_check_rpc_idl.py -v
          python3 scripts/cross-check-rpc-idl.py
          python3 scripts/test_audit_rpc_idl.py -v
          python3 scripts/audit-rpc-idl.py
