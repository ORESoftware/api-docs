name: DEN-3960 clippy fix

on:
  push:
    branches: [DEN-3960-rust-fs-routing]
    paths:
      - .github/workflows/den-3960-clippy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: DEN-3960-rust-fs-routing
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Apply the reviewed Clippy repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rust/src/pool_codegen.rs')
          s = p.read_text()
          old = '''        let rename = (rust_name != *wire_name)\n            .then(|| format!("    #[serde(rename = {wire_name:?})]\\n"))\n            .unwrap_or_default();'''
          new = '''        let rename = if rust_name != *wire_name {\n            format!("    #[serde(rename = {wire_name:?})]\\n")\n        } else {\n            String::new()\n        };'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one reviewed Clippy pattern, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify full Rust and isolated-client lanes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --bin api-docs-check --all-features --locked -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --all-features --locked
          cargo clippy -p ores-api-docs-client --all-targets --locked -- -D warnings
          cargo test --manifest-path clients/rust/Cargo.toml --locked
      - name: Commit reviewed repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/src/pool_codegen.rs
          git commit -m "[DEN-3960] Fix Rust 1.95 Clippy rename emission"
          git push origin HEAD:DEN-3960-rust-fs-routing
