name: temporary certified tree publication

on:
  push:
    branches:
      - hardening/rust-checker-migration-20260915

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: "${{ github.event.head_commit.message == 'ci: fix certified tree publication condition' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/rust-checker-migration-20260915
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Download and verify certified artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10420136634'
          EXPECTED_SHA256: f52745a84a75b933825b0476609da2715eb388ee998726cf2b014b0abd5c670b
        run: |
          set -euo pipefail
          curl --fail-with-body --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "$RUNNER_TEMP/certified.zip"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/certified.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/certified"
          unzip -q "$RUNNER_TEMP/certified.zip" -d "$RUNNER_TEMP/certified"
          test -s "$RUNNER_TEMP/certified/api-docs-certified-tree.tgz"
          test -s "$RUNNER_TEMP/certified/api-docs-certified.patch"

      - name: Restore exact certified non-workflow tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/certified/api-docs-certified-tree.tgz" -C "$GITHUB_WORKSPACE"
          git diff --check
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'refusing to publish unexpected workflow-file changes from the certified artifact' >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          test -n "$(git diff --cached --name-only)"

      - name: Publish certified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: move api-doc admission to Rust checker"
          git push origin HEAD:hardening/rust-checker-migration-20260915
