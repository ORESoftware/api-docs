name: tmp-main-clippy-baseline-fix

on:
  push:
    branches:
      - fix/api-docs-main-clippy-baseline-20260920
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/api-docs-main-clippy-baseline-20260920
          persist-credentials: true
          fetch-depth: 1
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Apply baseline cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          files = {
              'rust/src/page_layout_codegen.rs': [
                  ('page_compile_glue_with_layouts(&root, &[route.clone()])',
                   'page_compile_glue_with_layouts(&root, std::slice::from_ref(&route))'),
                  ('crate::fs_codegen::page_compile_glue(&root, &[route.clone()])',
                   'crate::fs_codegen::page_compile_glue(&root, std::slice::from_ref(&route))'),
              ],
              'rust/src/page_layout_router_codegen.rs': [
                  ('rewrite_router_page_entries(String::new(), &[route.clone()])',
                   'rewrite_router_page_entries(String::new(), std::slice::from_ref(&route))'),
              ],
          }
          for path, replacements in files.items():
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected exactly one {old!r}, found {text.count(old)}')
                  text = text.replace(old, new, 1)
              p.write_text(text)

          p = Path('rust/src/bin/api_docs_check/routes.rs')
          text = p.read_text()
          old = '''    #[cfg(test)]
              pub fn to_json(&self) -> Value {
                  match self {
                      Self::Null => Value::Null,
                      Self::Bool(value) => Value::Bool(*value),
                      Self::Number(value) => Value::Number(value.clone()),
                      Self::String(value) => Value::String(value.clone()),
                      Self::Array(items) => Value::Array(items.iter().map(Self::to_json).collect()),
                      Self::Object(entries) => {
                          let mut object = serde_json::Map::new();
                          for (key, value) in entries {
                              object.insert(key.clone(), value.to_json());
                          }
                          Value::Object(object)
                      }
                  }
              }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'routes.rs: expected one unused to_json block, found {text.count(old)}')
          p.write_text(text.replace(old, '', 1))
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
      - name: Verify Rust baseline
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/Cargo.toml --locked
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORESoftware automation"
          git config user.email "actions@users.noreply.github.com"
          git add rust/src/page_layout_codegen.rs rust/src/page_layout_router_codegen.rs rust/src/bin/api_docs_check/routes.rs
          git commit -m "fix(rust): restore clippy-clean main baseline"
          git push origin HEAD:fix/api-docs-main-clippy-baseline-20260920
