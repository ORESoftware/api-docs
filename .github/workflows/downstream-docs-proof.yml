name: downstream deterministic docs proof

on:
  pull_request:
    paths:
      - '.github/workflows/downstream-docs-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fiducia-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out proof fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: api-docs

      - name: Check out exact Fiducia PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: fiducia-cloud/fiducia-cli.rs
          ref: fde15e0011536ceb71861c6fae761ac45212c95c
          persist-credentials: false
          path: fiducia-cli

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Refresh exact Cargo graph
        working-directory: fiducia-cli
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          grep -q '^name = "ores-api-docs"$' Cargo.lock
          grep -Fq 'git+https://github.com/ORESoftware/api-docs.git?rev=3f3c7cc6061e6779911b52601644373ef9f78e9a#' Cargo.lock
          mkdir -p ../proof-output/fiducia
          cp Cargo.lock ../proof-output/fiducia/

      - name: Run Rust gates
        working-directory: fiducia-cli
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked

      - name: Prove byte-identical consumer docs trees
        working-directory: fiducia-cli
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p contracts
          cp ../api-docs/conformance/docs-publication/fiducia-cloud.route-map.json contracts/api.route-map.json
          cat > .api-docs.toml <<'EOF'
          schema_version = "ores.api-docs.publication-config.v1"
          route_map = "contracts/api.route-map.json"
          out_dir = ".fiducia/docs"
          publication_mode = "consumer_project"
          producer = "downstream-proof"
          EOF
          cargo run --locked -- docs
          find .fiducia/docs -type f -print0 | sort -z | xargs -0 sha256sum > "${RUNNER_TEMP}/fiducia-first.sha256"
          cargo run --locked -- docs
          find .fiducia/docs -type f -print0 | sort -z | xargs -0 sha256sum > "${RUNNER_TEMP}/fiducia-second.sha256"
          diff -u "${RUNNER_TEMP}/fiducia-first.sha256" "${RUNNER_TEMP}/fiducia-second.sha256"
          python3 - <<'PY'
          import json
          from pathlib import Path

          publication = json.loads(Path('.fiducia/docs/publication.json').read_text())
          assert publication['publication_mode'] == 'consumer_project'
          assert publication['authority_scope'] == 'project_owned'
          assert publication['publisher_provenance_required'] is False
          PY
          cp "${RUNNER_TEMP}/fiducia-second.sha256" ../proof-output/fiducia/docs.sha256
          cp .fiducia/docs/publication.json ../proof-output/fiducia/publication.json

      - name: Retain exact lock and determinism evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fiducia-docs-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: proof-output/fiducia
          if-no-files-found: error
          retention-days: 7
