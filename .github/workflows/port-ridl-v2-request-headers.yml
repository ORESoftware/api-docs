name: Port validated RIDL v2 request headers

on:
  push:
    branches:
      - feat/ridl-v2-typed-request-headers-2026-09-04

permissions:
  contents: write

jobs:
  port-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact current-main feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/ridl-v2-typed-request-headers-2026-09-04
          fetch-depth: 0

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Install Go 1.24.7
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.7'
          cache: false

      - name: Install Rust 1.95.0 with parser/formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Install Dart 3.6.0
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: '3.6.0'

      - name: Install Erlang and Gleam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '27.3.4.14'
          gleam-version: '1.14.0'

      - name: Port only non-overlapping RIDL v2 and generic authority files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin feat/typed-request-headers-2026-09-03
          git checkout origin/feat/typed-request-headers-2026-09-03 -- \
            json-schema/route-map-v2.schema.json \
            ridl/model.py \
            ridl/validate.py \
            ridl/emit/typescript.py \
            ridl/emit/rust.py \
            ridl/emit/go.py \
            ridl/emit/dart.py \
            ridl/emit/gleam.py \
            ridl/emit/python.py \
            ridl/emit/kotlin.py \
            ridl/emit/swift.py \
            ridl/emit/json_schema.py \
            examples/demo.route-map.json \
            ridl.json \
            idl/typespec/http-request-surface.tsp \
            json-schema/http-request-surface.schema.json \
            scripts/check-http-request-surface-authorities.py \
            scripts/test_http_request_surface_authorities.py \
            scripts/test_typed_request_headers.py \
            docs/typed-request-surfaces.md
          python - <<'PY'
          from pathlib import Path
          path = Path('idl/typespec/main.tsp')
          text = path.read_text()
          line = 'import "./http-request-surface.tsp";'
          if line not in text:
              text = text.rstrip() + '\n' + line + '\n'
          path.write_text(text)
          PY
          python -m py_compile \
            ridl/model.py ridl/validate.py ridl/emit/*.py \
            scripts/check-http-request-surface-authorities.py \
            scripts/test_http_request_surface_authorities.py \
            scripts/test_typed_request_headers.py

      - name: Install exact Python schema validator
        run: python -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1

      - name: Regenerate with current-main v1 tooling and the ported RIDL v2 tooling
        shell: bash
        run: |
          set -euo pipefail
          chmod -R u+w generated examples/generated clients 2>/dev/null || true
          python scripts/generate-routes.py
          python -m ridl generate --root .

      - name: Run peer-authority, lint, mutation, runtime-schema, and drift gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_http_request_surface_authorities.py -v
          python scripts/check-http-request-surface-authorities.py
          python scripts/test_request_surface_contracts.py -v
          python scripts/test_typed_request_headers.py -v
          python scripts/test_check_route_sync.py -v
          python -m ridl check --root .
          python -m ridl drift --root .
          python scripts/check-route-sync.py
          python scripts/generate-routes.py --check

      - name: Compile and parse every generated language surface
        shell: bash
        run: |
          set -euo pipefail

          echo '::group::TypeScript'
          npx --yes --package typescript@5.8.3 tsc --noEmit -p generated/typescript
          while IFS= read -r file; do
            npx --yes --package typescript@5.8.3 tsc --noEmit \
              --strict --target ES2022 --module NodeNext --moduleResolution NodeNext "$file"
          done < <(find examples/generated/typescript -type f -name '*.ts' -print)
          echo '::endgroup::'

          echo '::group::Python'
          while IFS= read -r file; do python -m py_compile "$file"; done \
            < <(find examples/generated/python -type f -name '*.py' -print)
          echo '::endgroup::'

          echo '::group::Rust'
          while IFS= read -r file; do rustfmt --edition 2024 --emit stdout "$file" > /dev/null; done \
            < <(find examples/generated/rust -type f -name '*.rs' -print)
          echo '::endgroup::'

          echo '::group::Go'
          while IFS= read -r file; do gofmt < "$file" > /dev/null; done \
            < <(find examples/generated/go -type f -name '*.go' -print)
          echo '::endgroup::'

          echo '::group::Dart'
          while IFS= read -r file; do dart analyze "$file"; done \
            < <(find examples/generated/dart -type f -name '*.dart' -print)
          echo '::endgroup::'

          echo '::group::Gleam'
          while IFS= read -r file; do gleam format --stdin < "$file" > /dev/null; done \
            < <(find examples/generated/gleam -type f -name '*.gleam' -print)
          echo '::endgroup::'

          if command -v swiftc >/dev/null 2>&1; then
            echo '::group::Swift'
            while IFS= read -r file; do swiftc -parse "$file"; done \
              < <(find examples/generated/swift -type f -name '*.swift' -print)
            echo '::endgroup::'
          fi

      - name: Prove the semantic port did not overwrite v1 authority work
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/main -- \
            json-schema/route-map.schema.json \
            scripts/check-route-sync.py \
            scripts/generate-routes.py \
            scripts/rpc_contract/model.py \
            scripts/rpc_contract/projections.py \
            scripts/test_request_surface_contracts.py \
            idl/typespec/v1.tsp \
            idl/protobuf/ores/rpc/v1/rpc.proto

      - name: Commit validated product code only
        shell: bash
        run: |
          set -euo pipefail
          find examples/generated -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/port-ridl-v2-request-headers.yml'
          git diff --cached --check
          git commit -m 'feat(ridl): type request headers across v2 clients'
          git push origin HEAD:feat/ridl-v2-typed-request-headers-2026-09-04
