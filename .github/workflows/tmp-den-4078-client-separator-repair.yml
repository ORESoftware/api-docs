name: tmp-den-4078-client-separator-repair

on:
  push:
    branches:
      - DEN-4078-http-response-framing-projection

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-4078-http-response-framing-projection
          fetch-depth: 1
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Repair separator and prove two-operation generation
        shell: bash
        run: |
          set -euo pipefail
          file='rust/src/client_codegen_v2.rs'
          perl -0pi -e 's/\.join\("\\\n"\);/.join("\\n");/g' "$file"
          if ! grep -q 'generated_allowlists_keep_operation_entries_line_separated' "$file"; then
            tmp="$(mktemp)"
            head -n -1 "$file" > "$tmp"
            printf '%s\n' \
              '' \
              '    #[test]' \
              '    fn generated_allowlists_keep_operation_entries_line_separated() {' \
              '        let map = RouteMap::from_json_str(r#"{"schema_version":"1.0.0","service":"demo-api","map":{"demo.health.alpha":{"path":"/v1/alpha","methods":["GET"],"rpc_key":"demo.health.alpha","transports":["http"]},"demo.health.beta":{"path":"/v1/beta","methods":["GET"],"rpc_key":"demo.health.beta","transports":["http"]}}}"#).expect("two-operation route map");' \
              '        let go = go_client(&map, "public", &"0".repeat(64));' \
              '        let gleam = gleam_client(&map, "public", &"0".repeat(64));' \
              '        assert!(go.contains(": {},\n\t"));' \
              '        assert!(gleam.contains(" -> True\n    "));' \
              '    }' \
              '}' >> "$tmp"
            mv "$tmp" "$file"
          fi
          cargo fmt --all
          cargo test --manifest-path rust/Cargo.toml --all-features --locked generated_allowlists_keep_operation_entries_line_separated
          git diff --check
          if git diff --quiet -- "$file"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$file"
          git commit -m 'fix(codegen): preserve generated allowlist line separators'
          git push origin HEAD:DEN-4078-http-response-framing-projection
