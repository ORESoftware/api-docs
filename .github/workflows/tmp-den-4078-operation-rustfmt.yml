name: tmp-den-4078-operation-rustfmt

on:
  push:
    branches:
      - DEN-4078-normalized-operation-exposure

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-4078-normalized-operation-exposure
          fetch-depth: 1
      - name: Install Rust 1.95.0 with formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and publish only the semantic binding Rust files
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet -- rust/src/graphql_projection.rs rust/src/operation_exposure.rs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rust/src/graphql_projection.rs rust/src/operation_exposure.rs
          git commit -m 'style(DEN-4078): apply canonical rustfmt to semantic binding'
          git push origin HEAD:DEN-4078-normalized-operation-exposure
