name: tmp-den-4078-route-parser-parity

on:
  push:
    branches:
      - DEN-4078-http-response-framing-projection

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-4078-http-response-framing-projection
          fetch-depth: 1
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Apply and prove parser parity
        shell: bash
        run: |
          set -euo pipefail
          patch='.github/tmp/den-4078-route-parser-parity.patch'
          git apply --check "$patch"
          git apply "$patch"
          cargo fmt --all
          cargo test --manifest-path macros/operation-rust/Cargo.toml route_metadata_tests
          cargo test --manifest-path rust/Cargo.toml --all-features --locked string_route_operation_paths_match_proc_macro_validation
          cargo clippy --manifest-path macros/operation-rust/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml --all-features --all-targets --locked -- -D warnings
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- macros/operation-rust/src/lib.rs rust/src/shared_operation.rs
          git rm -- "$patch" .github/workflows/tmp-den-4078-route-parser-parity.yml
          git commit -m 'fix(DEN-4078): align route operation parser admission'
          git push origin HEAD:DEN-4078-http-response-framing-projection
