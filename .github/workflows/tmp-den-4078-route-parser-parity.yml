name: tmp-den-4078-route-parser-parity

on:
  push:
    branches:
      - DEN-4078-http-response-framing-projection

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-4078-http-response-framing-projection
          fetch-depth: 1
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Harden proc-macro and static analyzer together
        shell: bash
        run: |
          set -euo pipefail
          macro='macros/operation-rust/src/lib.rs'
          analyzer='rust/src/shared_operation.rs'

          perl -0pi -e 'BEGIN {
            $old = qq~                Expr::Lit(ExprLit {
                    lit: Lit::Str(value),
                    ..
                }) => value.value(),~;
            $new = qq~                Expr::Lit(ExprLit {
                    lit: Lit::Str(value),
                    ..
                }) => {
                    syn::parse_str::<syn::Path>(&value.value()).map_err(|_| {
                        syn::Error::new_spanned(
                            value,
                            "ores_route operation must be a function path such as handlers::find_user",
                        )
                    })?;
                    value.value()
                },~;
          }
          index($_, $old) >= 0 or die "macro operation string branch not found\n";
          s/\Q$old\E/$new/;' "$macro"

          perl -0pi -e 'BEGIN {
            $old = qq~        Expr::Lit(ExprLit {
            lit: Lit::Str(value),
            ..
        }) => Ok(value
            .value()
            .rsplit("::")
            .next()
            .unwrap_or_default()
            .to_owned()),~;
            $new = qq~        Expr::Lit(ExprLit {
            lit: Lit::Str(value),
            ..
        }) => {
            let source = value.value();
            let parsed = syn::parse_str::<syn::Path>(&source).map_err(|_| {
                invalid_route(
                    path,
                    name,
                    "operation must be a function path such as handlers::find_user",
                )
            })?;
            parsed
                .segments
                .last()
                .map(|segment| segment.ident.to_string())
                .ok_or_else(|| {
                    invalid_route(
                        path,
                        name,
                        "operation must be a function path such as handlers::find_user",
                    )
                })
        },~;
          }
          index($_, $old) >= 0 or die "static analyzer operation string branch not found\n";
          s/\Q$old\E/$new/;' "$analyzer"

          perl -0pi -e 'BEGIN {
            $marker = qq~    #[test]
    fn projection_metadata_is_optional_and_order_independent() {~;
            $insert = qq~    #[test]
    fn string_operation_paths_are_validated_before_macro_expansion() {
        let source = format!("operation = {:?}", "handlers::find_user");
        let operation = validate_route(&args(&source), &adapter("get"))
            .expect("valid string function path");
        assert_eq!(operation, "handlers::find_user");

        for value in ["", "handlers::", "not a path"] {
            let source = format!("operation = {value:?}");
            let message = error(&source);
            assert!(
                message.contains("must be a function path"),
                "{source}: {message}"
            );
        }
    }

    #[test]
    fn projection_metadata_is_optional_and_order_independent() {~;
          }
          index($_, $marker) >= 0 or die "macro test insertion point not found\n";
          s/\Q$marker\E/$insert/;' "$macro"

          perl -0pi -e 'BEGIN {
            $marker = qq~    #[test]
    fn streaming_response_framing_is_preserved_by_source_analysis() {~;
            $insert = qq~    #[test]
    fn string_route_operation_paths_match_proc_macro_validation() {
        let valid = syn::parse_str::<syn::Expr>(&format!("{:?}", "handlers::find_user"))
            .expect("string expression");
        assert_eq!(
            parse_route_operation_value("src/routes/users/route.rs", "get", &valid)
                .expect("valid string function path"),
            "find_user"
        );

        for value in ["", "handlers::", "not a path"] {
            let expression = syn::parse_str::<syn::Expr>(&format!("{value:?}"))
                .expect("string expression");
            let error = parse_route_operation_value(
                "src/routes/users/route.rs",
                "get",
                &expression,
            )
            .expect_err("malformed string function path must fail");
            assert!(
                format!("{error}").contains("must be a function path"),
                "{value:?}: {error}"
            );
        }
    }

    #[test]
    fn streaming_response_framing_is_preserved_by_source_analysis() {~;
          }
          index($_, $marker) >= 0 or die "analyzer test insertion point not found\n";
          s/\Q$marker\E/$insert/;' "$analyzer"

          cargo fmt --all
          cargo test --manifest-path macros/operation-rust/Cargo.toml route_metadata_tests
          cargo test --manifest-path rust/Cargo.toml --all-features --locked string_route_operation_paths_match_proc_macro_validation
          cargo clippy --manifest-path macros/operation-rust/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml --all-features --all-targets --locked -- -D warnings
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$macro" "$analyzer"
          git rm -- .github/workflows/tmp-den-4078-route-parser-parity.yml
          git commit -m 'fix(DEN-4078): align route operation parser admission'
          git push origin HEAD:DEN-4078-http-response-framing-projection
