name: tmp-den-4078-merge-main-framing-fixtures

on:
  push:
    branches:
      - DEN-4078-http-response-framing-projection

permissions:
  contents: write

jobs:
  merge-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-4078-http-response-framing-projection
          fetch-depth: 0
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Merge current main and migrate framing fixtures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff --no-edit origin/main

          graphql='rust/src/graphql_projection.rs'
          exposure='rust/src/operation_exposure.rs'

          perl -0pi -e 's#(http: Some\(crate::RpcHttpProjection \{\n\s+method: "GET"\.to_owned\(\),\n\s+path: "/v1/users/\{user_id\}"\.to_owned\(\),\n)(\s+\}\),)#$1                response_framing: crate::HttpResponseFraming::Single,\n$2#' "$graphql"
          perl -0pi -e 's#(right\.http = Some\(crate::RpcHttpProjection \{\n\s+method: "GET"\.to_owned\(\),\n\s+path: "/v2/users/\{user_id\}"\.to_owned\(\),\n)(\s+\}\);)#$1            response_framing: crate::HttpResponseFraming::Single,\n$2#' "$exposure"

          test "$(grep -c 'response_framing: crate::HttpResponseFraming::Single' "$graphql")" -ge 1
          test "$(grep -c 'response_framing: crate::HttpResponseFraming::Single' "$exposure")" -ge 1

          cargo fmt --all
          cargo clippy --manifest-path rust/Cargo.toml --bin api-docs-check --all-features --locked -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --all-features --locked
          cargo test --manifest-path rust/Cargo.toml --bin api-docs-check --all-features --locked
          cargo test --manifest-path runtime/rust/Cargo.toml --locked
          git diff --check

          git rm -- .github/workflows/tmp-den-4078-merge-main-framing-fixtures.yml
          git add -- "$graphql" "$exposure"
          git commit -m 'merge main: migrate semantic fixtures to explicit response framing'
          git push origin HEAD:DEN-4078-http-response-framing-projection
