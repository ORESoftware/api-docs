name: request-surface-contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: request-surface-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Check out reviewed TJSV implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 03ccc0ecdfc70f9198c3ccf80718910961d3fde1
          path: tmp/tjsv
          persist-credentials: false
          show-progress: false

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Install Go 1.24.7
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.24.7"
          cache: false

      - name: Install Rust 1.95.0 with rustfmt
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Install Dart 3.6.0
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: "3.6.0"

      - name: Install Erlang and Gleam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "27.3.4.14"
          gleam-version: "1.14.0"

      - name: Install exact schema and TJSV validators
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1
          npm ci --prefix tmp/tjsv --ignore-scripts --no-audit --no-fund
          test "$(git -C tmp/tjsv rev-parse HEAD)" = \
            "03ccc0ecdfc70f9198c3ccf80718910961d3fde1"
          git -C tmp/tjsv diff --exit-code -- .

      - name: Compile the existing RPC TypeSpec authority
        shell: bash
        run: |
          set -euo pipefail
          tmp/tjsv/node_modules/.bin/tsp compile \
            idl/typespec/main.tsp --no-emit

      - name: Require zero-waiver TJSV parity and differential evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence=tmp/http-request-surface-tjsv
          mkdir -p "$evidence"
          node tmp/tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec=idl/typespec/http/request-surface.tsp \
            --schema=json-schema/http-request-surface.schema.json \
            --instances=idl/typespec/http/instances \
            --output-dir="$evidence/generated" \
            --bundle-id=http-request-surface.typespec.generated.schema.json \
            --report="$evidence/report.json" \
            --contract-ir="$evidence/contract-ir.json" \
            --max-findings=100 \
            --quiet
          node - "$evidence/report.json" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const fail = (message) => {
            console.error(message);
            process.exit(1);
          };
          if (report.schema !== "ores.typespec-json-schema-validator.report/v1") {
            fail(`unexpected TJSV report schema: ${report.schema}`);
          }
          if (report.status !== "passed" || report.zeroUnexplainedFindings !== true) {
            fail(`TJSV did not pass cleanly: ${report.status}`);
          }
          if (!Array.isArray(report.findings) || report.findings.length !== 0) {
            fail(`TJSV retained ${report.findings?.length ?? "unknown"} finding(s)`);
          }
          const summary = report.differential?.summary;
          if (!summary || summary.probesEvaluated < 1) {
            fail("TJSV differential probes did not execute");
          }
          if ((summary.corpusInstances ?? 0) < 7) {
            fail(`TJSV evaluated only ${summary.corpusInstances ?? 0} corpus instances`);
          }
          if (summary.divergences !== 0 || summary.refusals !== 0) {
            fail(
              `TJSV differential lane diverged/refused: ` +
              `${summary.divergences}/${summary.refusals}`,
            );
          }
          NODE
          test -s "$evidence/contract-ir.json"
          test -s \
            "$evidence/generated/http-request-surface.typespec.generated.schema.json"

      - name: Enforce authority shape, anti-routing lint, runtime schemas, and drift
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_http_request_surface_authorities.py -v
          python scripts/check-http-request-surface-authorities.py
          python scripts/test_request_surface_contracts.py -v
          python scripts/test_typed_request_headers.py -v
          python scripts/test_check_route_sync.py -v
          python -m ridl check --root .
          python -m ridl drift --root .
          python scripts/check-route-sync.py
          python scripts/generate-routes.py --check

      - name: Compile and parse generated request clients
        shell: bash
        run: |
          set -euo pipefail

          npx --yes --package typescript@5.8.3 tsc --noEmit -p generated/typescript
          while IFS= read -r file; do
            npx --yes --package typescript@5.8.3 tsc --noEmit \
              --strict --target ES2022 --module NodeNext --moduleResolution NodeNext "$file"
          done < <(find examples/generated/typescript -type f -name '*.ts' -print)

          while IFS= read -r file; do python -m py_compile "$file"; done \
            < <(find examples/generated/python -type f -name '*.py' -print)

          while IFS= read -r file; do rustfmt --edition 2024 --emit stdout "$file" > /dev/null; done \
            < <(find examples/generated/rust -type f -name '*.rs' -print)

          while IFS= read -r file; do gofmt < "$file" > /dev/null; done \
            < <(find examples/generated/go -type f -name '*.go' -print)

          while IFS= read -r file; do dart analyze "$file"; done \
            < <(find examples/generated/dart -type f -name '*.dart' -print)

          while IFS= read -r file; do gleam format --stdin < "$file" > /dev/null; done \
            < <(find examples/generated/gleam -type f -name '*.gleam' -print)

          if command -v swiftc >/dev/null 2>&1; then
            while IFS= read -r file; do swiftc -parse "$file"; done \
              < <(find examples/generated/swift -type f -name '*.swift' -print)
          fi

      - name: Assert routing identity cannot include request values
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          schemas = sorted(Path("examples/generated/json-schema/operations").glob("*.json"))
          if not schemas:
              raise SystemExit("no generated per-operation request schemas")
          for path in schemas:
              schema = json.loads(path.read_text())
              if schema.get("x-ores-routing-identity") != ["method", "pathTemplate"]:
                  raise SystemExit(f"{path}: routing identity drift")
              if schema.get("x-ores-validation-only") != ["path", "query", "headers", "body"]:
                  raise SystemExit(f"{path}: validation-only annotation drift")
              forbidden = {"routeByHeader", "routeByQuery", "dispatchHeaders", "dispatchQuery"}
              if forbidden.intersection(schema.get("properties", {})):
                  raise SystemExit(f"{path}: request-value dispatch selector exposed")
          PY

      - name: Retain exact TJSV parity evidence
        if: ${{ always() && hashFiles('tmp/http-request-surface-tjsv/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: http-request-surface-tjsv-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/http-request-surface-tjsv
          if-no-files-found: error
          retention-days: 30
