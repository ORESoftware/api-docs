name: validation-parity-tool

on:
  pull_request:
    paths:
      - "tools/validation-parity/**"
      - "docs/adr/validation-parity-generated-artifacts-v2.md"
      - ".github/workflows/validation-parity-tool.yml"
  push:
    branches: [main]
    paths:
      - "tools/validation-parity/**"
      - "docs/adr/validation-parity-generated-artifacts-v2.md"
      - ".github/workflows/validation-parity-tool.yml"

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 1
      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          package-manager-cache: false
      - name: Run adversarial generator self-tests
        run: node tools/validation-parity/parity-tool.mjs --self-test
