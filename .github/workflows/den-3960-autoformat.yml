name: DEN-3960 one-shot rustfmt

on:
  push:
    branches: [DEN-3960-rust-fs-routing]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[rustfmt]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: DEN-3960-rust-fs-routing
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit exact rustfmt output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m '[rustfmt] normalize DEN-3960 Rust sources'
          git push origin HEAD:DEN-3960-rust-fs-routing
