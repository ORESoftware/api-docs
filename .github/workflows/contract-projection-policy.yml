name: contract projection policy

on:
  pull_request:
    paths:
      - "governance/contract-projection-policy.json"
      - "scripts/check-contract-projection-policy.mjs"
      - ".github/workflows/contract-projection-policy.yml"
  push:
    branches: [main]
    paths:
      - "governance/contract-projection-policy.json"
      - "scripts/check-contract-projection-policy.mjs"
      - ".github/workflows/contract-projection-policy.yml"

permissions:
  contents: read

jobs:
  projection-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Verify exact revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Validate authority/projection boundary
        run: node scripts/check-contract-projection-policy.mjs
