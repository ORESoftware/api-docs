name: den-3959-rpc-config-lock-fix-sidecar

on:
  push:
    branches:
      - den-3959-rpc-config-lock-fix-sidecar

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: den-3959-rpc-config-lock-fix-sidecar
          fetch-depth: 1
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Align config workflow with canonical rpc-v1-core TJSV profile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ores-rpc-config-tjsv.yml')
          text = p.read_text()
          text = text.replace('TJSV_REVISION: a4b731fbf82c4d162abd74fd03758fa32bb76176', 'TJSV_REVISION: d60d0d79d83e075077382623ec9e23a401ab601f')
          text = text.replace('ref: ${{ env.TJSV_REVISION }}', 'ref: d60d0d79d83e075077382623ec9e23a401ab601f')
          p.write_text(text)
          PY
      - name: Register workflow in the self-digesting TJSV consumer lock
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { lockDigest } from './scripts/check-tjsv-consumer-lock.mjs';
          const path = 'contracts/tjsv-consumer.lock.json';
          const lock = JSON.parse(readFileSync(path, 'utf8'));
          const profile = lock.profiles.find(p => p.id === 'rpc-v1-core');
          if (!profile) throw new Error('rpc-v1-core consumer profile missing');
          const ref = '.github/workflows/ores-rpc-config-tjsv.yml';
          if (!profile.pinReferences.includes(ref)) profile.pinReferences.push(ref);
          profile.pinReferences.sort();
          lock.selfDigest = lockDigest(lock);
          writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`);
          JS
      - name: Prove consumer-lock ownership and strict declaration audit
        run: |
          node scripts/check-tjsv-consumer-lock.mjs
          python3 scripts/test_audit_rpc_idl.py -v
          python3 scripts/audit-rpc-idl.py
      - name: Remove sidecar and commit verified fix
        run: |
          rm .github/workflows/den-3959-rpc-config-lock-fix-sidecar.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ores-rpc-config-tjsv.yml contracts/tjsv-consumer.lock.json .github/workflows/den-3959-rpc-config-lock-fix-sidecar.yml
          git commit -m 'DEN-3959: register RPC config TJSV consumer profile'
          git push origin HEAD:den-3959-rpc-config-lock-fix-sidecar
