name: RPC v1 four-language conformance

on:
  pull_request:
    paths:
      - "clients/dart/lib/rpc_v1.dart"
      - "clients/dart/lib/src/rpc_v1*.dart"
      - "clients/dart/test/rpc_v1_test.dart"
      - "clients/go/**"
      - "clients/typescript/src/index.js"
      - "clients/typescript/src/index.d.ts"
      - "clients/typescript/src/rpc*"
      - "clients/typescript/package*.json"
      - "clients/rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/Cargo.toml"
      - "rust/src/rpc_v1.rs"
      - "rust/src/rpc_v1/**"
      - "rust/src/lib.rs"
      # The transport-neutral operation runtime. Without these, a change confined
      # to the runtime would skip the job that tests it with Axum compiled out.
      - "rust/src/operation_runtime.rs"
      - "rust/src/operation_policy.rs"
      - "rust/src/operation_dispatch.rs"
      - "rust/src/operation_dispatch_input.rs"
      - "rust/src/operation_spec.rs"
      - "rust/src/operation_server_stream.rs"
      - "rust/src/typed_operation_context.rs"
      - "rust/src/rpc_http_context.rs"
      - "rust/src/rpc_shared_operation.rs"
      - "rust/tests/operation_runtime_feature_isolation.rs"
      - "rust/src/bin/api-docs-check.rs"
      - "rust/src/bin/api_docs_check/**"
      - "examples/rpc-v1/conformance.json"
      - "runtime/v1-conformance.json"
      - "runtime/V1_FOUR_LANGUAGE_CONFORMANCE.md"
      - "idl/typespec/v1.tsp"
      - "idl/protobuf/ores/rpc/v1/rpc.proto"
      - "idl/rpc-v1-receipt-state-deltas.json"
      - "idl/rpc-v1-projection-admission.policy.json"
      - "json-schema/rpc-call.schema.json"
      - "json-schema/rpc-receipt.schema.json"
      - "scripts/audit-rpc-v1-state.py"
      - "scripts/test_audit_rpc_v1_state.py"
      - "scripts/test_rpc_v1_runtime.py"
      - "scripts/test-rpc-v1-tjsv-conformance.mjs"
      - "scripts/projection-evidence-io.mjs"
      - "scripts/tjsv-source-integrity.mjs"
      - "docs/rpc-v1-tjsv-conformance.md"
      - ".github/workflows/rpc-v1-runtime-conformance.yml"
  push:
    branches: [main]
    paths:
      - "clients/dart/lib/rpc_v1.dart"
      - "clients/dart/lib/src/rpc_v1*.dart"
      - "clients/dart/test/rpc_v1_test.dart"
      - "clients/go/**"
      - "clients/typescript/src/index.js"
      - "clients/typescript/src/index.d.ts"
      - "clients/typescript/src/rpc*"
      - "clients/typescript/package*.json"
      - "clients/rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/Cargo.toml"
      - "rust/src/rpc_v1.rs"
      - "rust/src/rpc_v1/**"
      - "rust/src/lib.rs"
      # The transport-neutral operation runtime. Without these, a change confined
      # to the runtime would skip the job that tests it with Axum compiled out.
      - "rust/src/operation_runtime.rs"
      - "rust/src/operation_policy.rs"
      - "rust/src/operation_dispatch.rs"
      - "rust/src/operation_dispatch_input.rs"
      - "rust/src/operation_spec.rs"
      - "rust/src/operation_server_stream.rs"
      - "rust/src/typed_operation_context.rs"
      - "rust/src/rpc_http_context.rs"
      - "rust/src/rpc_shared_operation.rs"
      - "rust/tests/operation_runtime_feature_isolation.rs"
      - "rust/src/bin/api-docs-check.rs"
      - "rust/src/bin/api_docs_check/**"
      - "examples/rpc-v1/conformance.json"
      - "runtime/v1-conformance.json"
      - "runtime/V1_FOUR_LANGUAGE_CONFORMANCE.md"
      - "idl/typespec/v1.tsp"
      - "idl/protobuf/ores/rpc/v1/rpc.proto"
      - "idl/rpc-v1-receipt-state-deltas.json"
      - "idl/rpc-v1-projection-admission.policy.json"
      - "json-schema/rpc-call.schema.json"
      - "json-schema/rpc-receipt.schema.json"
      - "scripts/audit-rpc-v1-state.py"
      - "scripts/test_audit_rpc_v1_state.py"
      - "scripts/test_rpc_v1_runtime.py"
      - "scripts/test-rpc-v1-tjsv-conformance.mjs"
      - "scripts/projection-evidence-io.mjs"
      - "scripts/tjsv-source-integrity.mjs"
      - "docs/rpc-v1-tjsv-conformance.md"
      - ".github/workflows/rpc-v1-runtime-conformance.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
      - name: Verify runtime conformance
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-features --locked
          cargo check --manifest-path rust/Cargo.toml --no-default-features --features operation-runtime --locked
          python3 scripts/test_rpc_v1_runtime.py
