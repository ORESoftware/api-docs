name: route-sync-sibling-resolution

on:
  pull_request:
    paths:
      - "scripts/install-into.py"
      - "scripts/resolve-sibling-ref.py"
      - "scripts/test_install_into.py"
      - "scripts/test_resolve_sibling_ref.py"
      - "docs/same-branch-route-sync.md"
      - ".github/workflows/route-sync-sibling-resolution.yml"
  push:
    branches: [main]
    paths:
      - "scripts/install-into.py"
      - "scripts/resolve-sibling-ref.py"
      - "scripts/test_install_into.py"
      - "scripts/test_resolve_sibling_ref.py"
      - "docs/same-branch-route-sync.md"
      - ".github/workflows/route-sync-sibling-resolution.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: route-sync-sibling-resolution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Compile resolver and installer
        run: >-
          python -m py_compile
          scripts/install-into.py
          scripts/resolve-sibling-ref.py
          scripts/test_install_into.py
          scripts/test_resolve_sibling_ref.py

      - name: Test fail-closed sibling resolution
        run: python scripts/test_resolve_sibling_ref.py -v

      - name: Test deterministic consumer workflow generation
        run: python scripts/test_install_into.py -v
