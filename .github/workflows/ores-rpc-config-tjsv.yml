name: ORES RPC TOML contract

on:
  pull_request:
    paths:
      - '.ores-rpc.toml'
      - 'idl/typespec/ores-rpc-config.tsp'
      - 'json-schema/ores-rpc-config.schema.json'
      - 'contracts/ores-rpc-config/**'
      - 'scripts/ores_rpc_config.py'
      - '.github/workflows/ores-rpc-config-tjsv.yml'
  push:
    branches: [main]
    paths:
      - '.ores-rpc.toml'
      - 'idl/typespec/ores-rpc-config.tsp'
      - 'json-schema/ores-rpc-config.schema.json'
      - 'contracts/ores-rpc-config/**'
      - 'scripts/ores_rpc_config.py'
      - '.github/workflows/ores-rpc-config-tjsv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TJSV_REVISION: a4b731fbf82c4d162abd74fd03758fa32bb76176
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Check out immutable TJSV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: ${{ env.TJSV_REVISION }}
          path: .tjsv
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install locked validator dependencies
        working-directory: .tjsv
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Normalize and semantically validate the committed TOML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/ores-rpc-config
          python3 scripts/ores_rpc_config.py .ores-rpc.toml --output target/ores-rpc-config/root.json
          cmp target/ores-rpc-config/root.json <(python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('contracts/ores-rpc-config/instances/OresRpcConfig/valid/hybrid.json')
          print(json.dumps(json.loads(p.read_text()), indent=2, sort_keys=True))
          PY
          )

      - name: Re-admit independent TypeSpec and JSON Schema authorities
        shell: bash
        run: |
          set -euo pipefail
          node .tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec=idl/typespec/ores-rpc-config.tsp \
            --schema=json-schema/ores-rpc-config.schema.json \
            --instances=contracts/ores-rpc-config/instances \
            --report=target/ores-rpc-config/report.json \
            --sarif=target/ores-rpc-config/report.sarif \
            --contract-ir=target/ores-rpc-config/contract-ir.json \
            --output-dir=target/ores-rpc-config/generated-schema-b \
            --max-probes=256 \
            --int64-strategy=string \
            --seal-object-schemas=true \
            --polymorphic-models-strategy=oneOf

      - name: Verify current authority inputs
        env:
          TSJSV_VERIFY_IR: target/ores-rpc-config/contract-ir.json
          TSJSV_VERIFY_REPORT: target/ores-rpc-config/report.json
          TSJSV_VERIFY_TYPESPEC: idl/typespec/ores-rpc-config.tsp
          TSJSV_VERIFY_AUTHORED: json-schema/ores-rpc-config.schema.json
          TSJSV_VERIFY_GENERATED: target/ores-rpc-config/generated-schema-b/typespec.generated.schema.json
          TSJSV_VERIFY_DECLARATIONS: '["Ores.ApiDocs.RpcConfig.OresRpcConfig","Ores.ApiDocs.RpcConfig.RpcRuntimeConfig","Ores.ApiDocs.RpcConfig.RpcEnvBinding","Ores.ApiDocs.RpcConfig.RpcFlags2EnvConfig"]'
          TSJSV_VERIFY_VERIFICATION: target/ores-rpc-config/verification.json
        run: node .tjsv/scripts/verify-consumer.mjs

      - name: Prove semantic rejection of secret defaults and hybrid root aliasing
        shell: bash
        run: |
          set -euo pipefail
          cp .ores-rpc.toml /tmp/bad-secret.toml
          cat >> /tmp/bad-secret.toml <<'EOF'
          default = "must-not-be-accepted"
          EOF
          if python3 scripts/ores_rpc_config.py /tmp/bad-secret.toml >/dev/null 2>&1; then
            echo 'secret default unexpectedly accepted' >&2
            exit 1
          fi
          sed 's/server_root = "rust"/server_root = "clients"/' .ores-rpc.toml >/tmp/bad-roots.toml
          if python3 scripts/ores_rpc_config.py /tmp/bad-roots.toml >/dev/null 2>&1; then
            echo 'overlapping client/server roots unexpectedly accepted' >&2
            exit 1
          fi

      - name: Upload deterministic contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ores-rpc-config-${{ github.sha }}
          path: target/ores-rpc-config/
          if-no-files-found: error
          retention-days: 30
