name: ores-web-page-manifest

on:
  pull_request:
    paths:
      - "contracts/ores-web-page-manifest/**"
      - "rust/src/page_docs.rs"
      - "rust/tests/web_page_api_boundary.rs"
      - ".github/workflows/ores-web-page-manifest.yml"
  push:
    branches: [main]
    paths:
      - "contracts/ores-web-page-manifest/**"
      - "rust/src/page_docs.rs"
      - "rust/tests/web_page_api_boundary.rs"
      - ".github/workflows/ores-web-page-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-web-page-manifest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  peer-authority-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Verify exact candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Require complete zero-waiver declaration mapping
        run: |
          set -euo pipefail
          jq -e '
            .schema == "ores.typespec-json-schema-validator.mapping/v1" and
            (.declarations | length) == 2 and
            .ignore.typespec == [] and
            .ignore.generated == [] and
            .ignore.authored == [] and
            ([.declarations[].typespec] | unique | length) == 2 and
            ([.declarations[].generated] | unique | length) == 2 and
            ([.declarations[].authored] | unique | length) == 2
          ' contracts/ores-web-page-manifest/tjsv.mapping.json

      - name: Compare independent TypeSpec and JSON Schema authorities
        uses: ORESoftware/typespec-json-schema-validator@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          typespec: contracts/ores-web-page-manifest/typespec/main.tsp
          schema: contracts/ores-web-page-manifest/json-schema/authored.schema.json
          mapping: contracts/ores-web-page-manifest/tjsv.mapping.json
          report: .typespec-json-schema-validator/ores-web-page-manifest/report.json
          sarif: .typespec-json-schema-validator/ores-web-page-manifest/report.sarif
          contract_ir: .typespec-json-schema-validator/ores-web-page-manifest/contract-ir.json
          output_dir: .typespec-json-schema-validator/ores-web-page-manifest/generated
          int64_strategy: number
          quiet: "false"

      - name: Require peer authorities and non-authoritative derived evidence
        run: |
          set -euo pipefail
          jq -e '
            .schema == "ores.typespec-json-schema-validator.report/v1" and
            .status == "passed" and
            .zeroUnexplainedFindings == true and
            .authorities.precedence == "none" and
            .authorities.typespec.authority == "independently-authored" and
            .authorities.jsonSchema.authority == "independently-authored" and
            .authorities.typespec.generatedJsonSchemaRole == "comparison-evidence-only" and
            (.findings | length) == 0 and
            (.differential.summary.probesEvaluated // 0) > 0 and
            (.differential.summary.divergences // 0) == 0 and
            (.differential.summary.refusals // 0) == 0
          ' .typespec-json-schema-validator/ores-web-page-manifest/report.json
          jq -e '
            .schema == "ores.typespec-json-schema-validator.contract-ir/v1" and
            .status == "passed" and
            .admissible == true and
            .role == "downstream-derived-parity-artifact" and
            .editableAuthority == false
          ' .typespec-json-schema-validator/ores-web-page-manifest/contract-ir.json

      - name: Prove authored authorities were not rewritten
        run: git diff --exit-code -- contracts/ores-web-page-manifest

      - name: Retain deterministic TJSV evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ores-web-page-manifest-${{ github.event.pull_request.head.sha || github.sha }}
          path: .typespec-json-schema-validator/ores-web-page-manifest
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
