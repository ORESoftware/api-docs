name: DEN-4078 Gleam emitter repair

on:
  push:
    branches:
      - DEN-4078/gleam-no-section-typed-rpc
    paths:
      - rust/tests/typed_rpc_gleam_no_section.rs
      - .github/workflows/den-4078-gleam-no-section-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-4078/gleam-no-section-typed-rpc
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Repair NoSection call projection
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'rust/src/typed_rpc_sdk_codegen.rs';
          const source = fs.readFileSync(file, 'utf8');
          const start = source.indexOf('fn emit_gleam(');
          const end = source.indexOf('fn emit_gleam_section_types(', start);
          if (start < 0 || end < 0 || end <= start) {
            throw new Error('could not isolate emit_gleam function');
          }
          let chunk = source.slice(start, end);

          const anchor = '        let response = format!("{}Response", operation.pascal);\n        out.push_str(&format!(\n';
          const insertion = '        let response = format!("{}Response", operation.pascal);\n        let sections = request_sections(operation);\n        let json_field = |field: &str| {\n            if sections.iter().any(|(_, candidate, _)| *candidate == field) {\n                format!("input.{field}_json")\n            } else {\n                "option.None".to_owned()\n            }\n        };\n        let path_json = json_field("path");\n        let query_json = json_field("query");\n        let headers_json = json_field("headers");\n        let body_json = json_field("body");\n        out.push_str(&format!(\n';
          const anchorMatches = chunk.split(anchor).length - 1;
          if (anchorMatches !== 1) throw new Error(`expected one scoped Gleam response anchor, found ${anchorMatches}`);
          chunk = chunk.replace(anchor, insertion);

          const oldArgs = 'let args = CallArgs(input.path_json, input.query_json, input.headers_json, input.body_json, input.trace_id, input.span_id)';
          const newArgs = 'let args = CallArgs({path_json}, {query_json}, {headers_json}, {body_json}, input.trace_id, input.span_id)';
          const argMatches = chunk.split(oldArgs).length - 1;
          if (argMatches !== 1) throw new Error(`expected one scoped Gleam CallArgs projection, found ${argMatches}`);
          chunk = chunk.replace(oldArgs, newArgs);

          fs.writeFileSync(file, source.slice(0, start) + chunk + source.slice(end));
          NODE
          cargo fmt -p ores-api-docs
          cargo test -p ores-api-docs --test typed_rpc_gleam_no_section --locked

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/src/typed_rpc_sdk_codegen.rs
          git diff --cached --quiet && exit 0
          git commit -m 'DEN-4078: handle NoSection in typed Gleam calls'
          git push origin HEAD:DEN-4078/gleam-no-section-typed-rpc
