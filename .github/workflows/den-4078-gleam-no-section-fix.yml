name: DEN-4078 Gleam emitter repair

on:
  push:
    branches:
      - DEN-4078/gleam-no-section-typed-rpc
    paths:
      - .github/workflows/den-4078-gleam-no-section-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-4078/gleam-no-section-typed-rpc
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Repair NoSection call projection
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'rust/src/typed_rpc_sdk_codegen.rs';
          const source = fs.readFileSync(file, 'utf8');
          const old = `    for operation in operations {\n        emit_gleam_section_types(&mut out, operation)?;\n        let response = format!("{}Response", operation.pascal);\n        out.push_str(&format!(\n            "pub fn {}(transport: Transport, base_url: String, id: String, input: {}Input) -> Result({}, String) {\\n  let args = CallArgs(input.path_json, input.query_json, input.headers_json, input.body_json, input.trace_id, input.span_id)\\n  use raw <- result.try(call(transport, base_url, id, {:?}, args))\\n  case decode.run(raw, {}_response_decoder()) { Ok(value) -> Ok(value) Error(errors) -> Error(string.inspect(errors)) }\\n}\\n",\n            operation.rust_fn, operation.pascal, response, operation.contract.operation_key, snake(&operation.pascal)\n        ));\n    }`;
          const replacement = `    for operation in operations {\n        emit_gleam_section_types(&mut out, operation)?;\n        let response = format!("{}Response", operation.pascal);\n        let sections = request_sections(operation);\n        let json_field = |field: &str| {\n            if sections.iter().any(|(_, candidate, _)| *candidate == field) {\n                format!("input.{field}_json")\n            } else {\n                "option.None".to_owned()\n            }\n        };\n        let path_json = json_field("path");\n        let query_json = json_field("query");\n        let headers_json = json_field("headers");\n        let body_json = json_field("body");\n        out.push_str(&format!(\n            "pub fn {}(transport: Transport, base_url: String, id: String, input: {}Input) -> Result({}, String) {\\n  let args = CallArgs({path_json}, {query_json}, {headers_json}, {body_json}, input.trace_id, input.span_id)\\n  use raw <- result.try(call(transport, base_url, id, {:?}, args))\\n  case decode.run(raw, {}_response_decoder()) { Ok(value) -> Ok(value) Error(errors) -> Error(string.inspect(errors)) }\\n}\\n",\n            operation.rust_fn, operation.pascal, response, operation.contract.operation_key, snake(&operation.pascal)\n        ));\n    }`;
          const first = source.indexOf(old);
          if (first < 0 || source.indexOf(old, first + 1) >= 0) {
            throw new Error('expected exactly one typed Gleam operation loop to patch');
          }
          fs.writeFileSync(file, source.replace(old, replacement));
          NODE
          cargo fmt -p ores-api-docs
          cargo test -p ores-api-docs --test typed_rpc_gleam_no_section --locked

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/src/typed_rpc_sdk_codegen.rs
          git diff --cached --quiet && exit 0
          git commit -m 'DEN-4078: handle NoSection in typed Gleam calls'
          git push origin HEAD:DEN-4078/gleam-no-section-typed-rpc
