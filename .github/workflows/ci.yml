name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/Cargo.toml --all-features
      - run: cargo test --manifest-path runtime/rust/Cargo.toml

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix clients/typescript
      - run: npm test --prefix clients/typescript

  route-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export exact source tree for the RPC audit
        uses: actions/upload-artifact@v4
        with:
          name: rpc-audit-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install checksum-verified Zed 0.2.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/zed.tar.gz" \
            https://github.com/zed-pkg/zed-cli/releases/download/v0.2.3/zed-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            b8f81a8e4943cbaeb47153386819a911dcf02666a8709c5bd013e4f35b1ba1b9 \
            "$RUNNER_TEMP/zed.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/zed.tar.gz" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: pip install jsonschema
      - run: zed validate
      - run: zed pack --out "$RUNNER_TEMP/zpkg-pack"
      - run: python -m ridl check --root .
      - run: python -m ridl.cli check --root .
      - run: python scripts/ridl check --root .
      - run: python scripts/test_check_route_sync.py -v
      - run: python scripts/test_e2e_rpc.py -v
      - run: python scripts/test_framing.py -v
      - run: python scripts/test_generated_contract.py -v
      - run: python scripts/test_cross_check_rpc_idl.py -v
      - run: python scripts/cross-check-rpc-idl.py
      - run: python -m ridl.cli drift --root .
      - run: python scripts/check-generated-contract.py --self-test
      - run: python scripts/check-generated-contract.py --freeze --require-readonly
      - run: python scripts/check-route-sync.py
      - run: python scripts/generate-routes.py --check
      - run: node --experimental-strip-types --test runtime/typescript/frame.conformance.test.ts

  gleam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.14.0"
      - run: gleam test
        working-directory: clients/gleam
      - run: gleam build
        working-directory: generated/gleam

  generated-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes -p typescript@5.8.3 tsc --noEmit -p generated/typescript

  dart-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.6.0"
      - run: dart pub get
        working-directory: clients/dart
      - run: dart test
        working-directory: clients/dart

  generated-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.6.0"
      - run: dart pub get
        working-directory: generated/dart
      - run: dart analyze --fatal-infos
        working-directory: generated/dart