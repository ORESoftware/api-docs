name: one-shot-rustfmt-rpc

on:
  push:
    branches:
      - feat/shared-operation-rpc-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/shared-operation-rpc-v1
          token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format exact branch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git diff -- rust/src/client_codegen.rs rust/src/pool_codegen.rs
      - name: Commit formatted sources and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/src/client_codegen.rs rust/src/pool_codegen.rs
          git rm .github/workflows/one-shot-rustfmt-rpc.yml
          git commit -m 'style(rpc): format generated client tests'
          git push origin HEAD:feat/shared-operation-rpc-v1
