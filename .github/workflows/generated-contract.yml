name: generated-contract

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Runtime generated contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
      - name: Install exact JSON Schema validator
        run: >-
          python -m pip install --disable-pip-version-check --quiet
          jsonschema==4.25.1
      - name: Check generated policy, freeze bits, and JSON Schema runtime
        run: python scripts/check-generated-contract.py --freeze --require-readonly
      - name: Strict TypeSpec × JSON Schema × Protobuf admission
        run: |
          set -euo pipefail
          cargo test --quiet --locked --manifest-path rust/Cargo.toml --bin api-docs-check
          cargo run --quiet --locked --manifest-path rust/Cargo.toml --bin api-docs-check -- cross-check-rpc-idl
          cargo run --quiet --locked --manifest-path rust/Cargo.toml --bin api-docs-check -- audit-rpc-idl
      - name: Generate and verify digest-bound docs/language bundle
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path rust/Cargo.toml --bin api-docs-check -- rpc-contract-bundle --check
