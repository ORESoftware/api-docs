name: one-shot-format-typed-rpc

on:
  push:
    branches:
      - fix/typed-rpc-sdk-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/typed-rpc-sdk-v2
          token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format exact branch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
      - name: Commit formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/src/client_codegen_v2.rs rust/src/lib.rs rust/src/typed_rpc_sdk_codegen.rs
          git rm .github/workflows/one-shot-format-typed-rpc.yml
          git commit -m 'style(rpc): format typed SDK generator'
          git push origin HEAD:fix/typed-rpc-sdk-v2