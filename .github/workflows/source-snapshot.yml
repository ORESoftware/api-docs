name: apply-request-contract-v1-headers

on:
  push:
    branches: [codex/request-contract-v1-headers]

permissions:
  contents: write

concurrency:
  group: request-contract-v1-headers-writer
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: codex/request-contract-v1-headers

      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/request-contract-v1-headers.patch.gz.b64.* > "$RUNNER_TEMP/change.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/change.patch.gz.b64" | gzip --decompress > "$RUNNER_TEMP/change.patch"
          echo "83d9e1fff013165052983b17c55e773079376e829fa9cd0e9f698b228e2460d0  $RUNNER_TEMP/change.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/change.patch"
          git apply --whitespace=error "$RUNNER_TEMP/change.patch"

      - name: Run writer smoke gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_rpc_v1_runtime.py -v
          python3 scripts/cross-check-rpc-idl.py
          python3 scripts/generate-routes.py --check
          python3 scripts/rpc-contract-bundle.py --check
          (cd clients/go && go test ./...)
          node --check clients/typescript/src/index.js
          node --check clients/typescript/src/rpc.js
          git diff --check

      - name: Commit source and remove staging machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/request-contract-v1-headers.patch.gz.b64.*
          rm -f .github/workflows/source-snapshot.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat(rpc): type request headers across the v1 contract"
          git push origin HEAD:codex/request-contract-v1-headers
