name: source-snapshot

on:
  push:
    branches: [codex/request-contract-v1-headers]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 1
      - name: Archive source without Git metadata
        shell: bash
        run: tar --exclude=.git -czf "$RUNNER_TEMP/api-docs-source.tar.gz" .
      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-docs-source-${{ github.sha }}
          path: ${{ runner.temp }}/api-docs-source.tar.gz
          if-no-files-found: error
          retention-days: 1
