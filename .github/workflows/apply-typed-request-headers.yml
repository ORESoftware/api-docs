name: Apply typed request header contracts

on:
  push:
    branches:
      - feat/typed-request-headers-2026-09-03

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/typed-request-headers-2026-09-03
          fetch-depth: 0

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Install Go 1.24.7
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.7'
          cache: false

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Install Dart 3.6.0
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: '3.6.0'

      - name: Install Erlang and Gleam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '27.3.4.14'
          gleam-version: '1.14.0'

      - name: Apply semantic contract changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('scripts/_apply_typed_request_headers.py')
          lines = source.read_text().splitlines()
          repaired = 0
          marker = 'default = "" if any(p.required for p in route.query_params) else '
          for index, line in enumerate(lines):
              if marker in line and line.endswith('else \\'):
                  lines[index] = line + '\\'
                  repaired += 1
          if repaired != 2:
              raise SystemExit(f'expected two Python emitter patch literals, repaired {repaired}')
          source.write_text('\n'.join(lines) + '\n')
          PY
          python -m py_compile scripts/_apply_typed_request_headers.py
          python scripts/_apply_typed_request_headers.py
          python - <<'PY'
          from pathlib import Path
          test = Path('scripts/test_typed_request_headers.py')
          lines = test.read_text().splitlines()
          if 'import sys' in lines:
              raise SystemExit('typed-header test already imports sys')
          unittest_index = lines.index('import unittest')
          lines.insert(unittest_index, 'import sys')
          validator_index = lines.index('from jsonschema import Draft202012Validator')
          lines[validator_index:validator_index] = [
              '',
              'ROOT = Path(__file__).resolve().parents[1]',
              'sys.path.insert(0, str(ROOT))',
              '',
          ]
          test.write_text('\n'.join(lines) + '\n')
          PY
          python -m py_compile \
            ridl/model.py ridl/validate.py ridl/emit/*.py \
            scripts/check-route-sync.py scripts/generate-routes.py \
            scripts/rpc_contract/model.py scripts/rpc_contract/projections.py \
            scripts/check-http-request-surface-authorities.py \
            scripts/test_http_request_surface_authorities.py \
            scripts/test_typed_request_headers.py

      - name: Install exact Python validator
        run: python -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1

      - name: Generate tracked v1 and v2 artifacts
        shell: bash
        run: |
          set -euo pipefail
          chmod -R u+w generated examples/generated clients 2>/dev/null || true
          python scripts/generate-routes.py
          python -m ridl generate --root .

      - name: Run contract, mutation, drift, and static checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_http_request_surface_authorities.py -v
          python scripts/check-http-request-surface-authorities.py
          python scripts/test_request_surface_contracts.py -v
          python scripts/test_typed_request_headers.py -v
          python scripts/test_check_route_sync.py -v
          python -m ridl check --root .
          python -m ridl drift --root .
          python scripts/check-route-sync.py
          python scripts/generate-routes.py --check

      - name: Compile generated TypeScript, Go, Rust, Dart, and Gleam
        shell: bash
        run: |
          set -euo pipefail
          npx --yes --package typescript@5.8.3 tsc --noEmit -p generated/typescript
          if [ -f examples/generated/typescript/generated/demo/ridl_generated.ts ]; then
            npx --yes --package typescript@5.8.3 tsc --noEmit \
              --strict --target ES2022 --module NodeNext --moduleResolution NodeNext \
              examples/generated/typescript/generated/demo/ridl_generated.ts
          fi
          if [ -f examples/generated/rust/generated/demo/ridl_generated.rs ]; then
            rustfmt --edition 2024 --emit stdout examples/generated/rust/generated/demo/ridl_generated.rs > /dev/null
          fi
          if [ -f examples/generated/go/generated/demo/ridl_generated.go ]; then
            gofmt -d examples/generated/go/generated/demo/ridl_generated.go > "$RUNNER_TEMP/gofmt.diff"
            test ! -s "$RUNNER_TEMP/gofmt.diff"
          fi
          if [ -d examples/generated/dart/generated/demo ]; then
            dart format --output=none --set-exit-if-changed examples/generated/dart/generated/demo
          fi
          if [ -d examples/generated/gleam/generated/demo ]; then
            gleam format --check examples/generated/gleam/generated/demo
          fi

      - name: Commit validated product changes and remove one-use tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_apply_typed_request_headers.py
          rm -f .github/workflows/apply-typed-request-headers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(http): type and validate request headers'
          git push origin HEAD:feat/typed-request-headers-2026-09-03
