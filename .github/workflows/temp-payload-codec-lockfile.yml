name: temporary payload codec lockfile

on:
  push:
    branches:
      - feat/payload-codec-runtime-v1

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/payload-codec-runtime-v1
          fetch-depth: 0

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0

      - name: Generate lockfile
        run: cargo generate-lockfile --manifest-path rust/Cargo.toml

      - name: Commit lockfile only when changed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m 'chore(rust): refresh lockfile for payload codecs'
          git push origin HEAD:feat/payload-codec-runtime-v1
