name: tmp-pr205-rust-fix

on:
  push:
    branches:
      - feat/web-page-manifest-render-chain-20260920
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/web-page-manifest-render-chain-20260920
          persist-credentials: true
          fetch-depth: 1
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Fix thiserror field semantics and format
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('rust/src/page_manifest.rs')
          text = p.read_text()
          replacements = [
              ('page render-source admission failed for {source}: {message}', 'page render-source admission failed for {page_source}: {message}'),
              ('RenderSource { source: String, message: String }', 'RenderSource { page_source: String, message: String }'),
              ('page generator-source admission failed for {source}: {message}', 'page generator-source admission failed for {generator_source}: {message}'),
              ('GeneratorSource { source: String, message: String }', 'GeneratorSource { generator_source: String, message: String }'),
              ('page {source} has revalidate_secs={value}', 'page {page_source} has revalidate_secs={value}'),
              ('        source: String,\n        value: u64,', '        page_source: String,\n        value: u64,'),
              ('WebPageManifestError::RevalidateRange {\n                    source: route.source.clone(),', 'WebPageManifestError::RevalidateRange {\n                    page_source: route.source.clone(),'),
              ('WebPageManifestError::RenderSource {\n                source: route.source.clone(),', 'WebPageManifestError::RenderSource {\n                page_source: route.source.clone(),'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence: {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          # Every GeneratorSource constructor refers to the offending generator path.
          text = text.replace('WebPageManifestError::GeneratorSource {\n            source:', 'WebPageManifestError::GeneratorSource {\n            generator_source:')
          text = text.replace('WebPageManifestError::GeneratorSource {\n                source:', 'WebPageManifestError::GeneratorSource {\n                generator_source:')
          if 'WebPageManifestError::GeneratorSource {\n            source:' in text or 'WebPageManifestError::GeneratorSource {\n                source:' in text:
              raise SystemExit('unconverted GeneratorSource source field')
          if 'generator_generator_source:' in text:
              raise SystemExit('double-renamed GeneratorSource field')
          p.write_text(text)
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
          test "$(git diff --name-only)" = "rust/src/page_manifest.rs"
      - name: Verify focused and full Rust surface
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/Cargo.toml page_manifest --locked
          cargo test --manifest-path rust/Cargo.toml page_layout --locked
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORESoftware automation"
          git config user.email "actions@users.noreply.github.com"
          git add rust/src/page_manifest.rs
          git commit -m "fix(web): compile and format page manifest errors"
          git push origin HEAD:feat/web-page-manifest-render-chain-20260920
