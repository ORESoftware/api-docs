name: DEN-3960 refresh lock once

on:
  push:
    branches: [DEN-3960-rust-fs-routing]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, 'DEN-3960 refresh Cargo.lock') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: DEN-3960-rust-fs-routing
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
      - name: Regenerate exact workspace lock and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          rm .github/workflows/den3960-refresh-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/workflows/den3960-refresh-lock.yml
          if git diff --cached --quiet; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          git commit -m 'DEN-3960 refresh Cargo.lock'
          git push origin HEAD:DEN-3960-rust-fs-routing
