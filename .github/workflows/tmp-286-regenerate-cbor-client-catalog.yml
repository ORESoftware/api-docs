name: temporary 286 regenerate CBOR client catalog

on:
  push:
    branches:
      - fix/286-cbor-client-catalog-parity

permissions:
  contents: write

concurrency:
  group: tmp-286-cbor-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          show-progress: false
          fetch-depth: 1

      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Patch only the authored catalog
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'contracts/rpc-client-options/v1/catalog.json';
          let text = fs.readFileSync(path, 'utf8');

          if (!text.includes('"variant_id": "cbor"')) {
            const variantsPattern = /(\{\s*"variant_id": "message_pack",\s*"wire_value": "message_pack",\s*"content_type": "application\/msgpack"\s*\},)(\s*\{\s*"variant_id": "protobuf")/s;
            if (!variantsPattern.test(text)) {
              throw new Error('serial_strategy insertion anchor drifted');
            }
            text = text.replace(
              variantsPattern,
              `$1\n        {\n          "variant_id": "cbor",\n          "wire_value": "cbor",\n          "content_type": "application/cbor"\n        },$2`,
            );
          }

          if (!text.includes('"option_id": "use_cbor"')) {
            const optionPattern = /(\n    \{\s*"option_id": "use_json",)/s;
            if (!optionPattern.test(text)) {
              throw new Error('use_json insertion anchor drifted');
            }
            const cborOption = `\n    {\n      "option_id": "use_cbor",\n      "group": "serialization",\n      "applies_to": "both",\n      "arity": "once",\n      "exclusive_group": "serialization",\n      "terminal": false,\n      "secret": false,\n      "params": [],\n      "plan_field": "serial_strategy",\n      "plan_value": "cbor",\n      "wire": {\n        "headers": {\n          "content-type": "application/cbor",\n          "accept": "application/cbor"\n        }\n      },\n      "summary": "Serialize the envelope as CBOR."\n    },`;
            text = text.replace(optionPattern, `${cborOption}$1`);
          }

          fs.writeFileSync(path, text);
          NODE

      - name: Regenerate every catalog-owned projection with repository authority
        run: cargo run --quiet --locked --manifest-path rust/Cargo.toml --bin ores-rpc-docs -- generate

      - name: Verify generator and focused catalog tests
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path rust/Cargo.toml --bin ores-rpc-docs -- check
          cargo test --quiet --locked --manifest-path rust/Cargo.toml rpc_client_options
          git diff --check

      - name: Commit deterministic generated result to this branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            contracts/rpc-client-options/v1/catalog.json \
            generated/rpc-client-options \
            docs/rpc-client-options.md \
            clients/typescript/src/options.generated.js \
            clients/typescript/src/options.generated.d.ts \
            rust/src/rpc_client_surface.rs
          git commit -m "fix(rpc): expose CBOR in generated client catalog"
          git push origin HEAD:fix/286-cbor-client-catalog-parity
