name: den-3959-rpc-ledger-fix-sidecar

on:
  push:
    branches:
      - den-3959-rpc-ledger-fix-sidecar

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: den-3959-rpc-ledger-fix-sidecar
          fetch-depth: 1
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Admit reviewed RPC config declarations into strict inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/audit-rpc-idl.py')
          text = path.read_text()
          needle = '''        "Ores.ApiDocs.DocsDiscoveryManifest",\n        "Ores.ApiDocs.DocsProjectionRoutes",\n'''
          replacement = needle + '''        "Ores.Rpc.Config.EnvironmentBinding",\n        "Ores.Rpc.Config.Flags2EnvConfig",\n        "Ores.Rpc.Config.OresRpcConfig",\n        "Ores.Rpc.Config.RepositoryMode",\n        "Ores.Rpc.Config.RoleConfig",\n        "Ores.Rpc.Config.RpcConfig",\n        "Ores.Rpc.Config.RpcFraming",\n        "Ores.Rpc.Config.RpcTransport",\n        "Ores.Rpc.Config.TjsvConfig",\n'''
          if text.count(needle) != 1:
              raise SystemExit('reviewed TypeSpec inventory anchor did not match exactly once')
          path.write_text(text.replace(needle, replacement))
          PY
      - name: Run strict RPC declaration audit
        run: |
          python scripts/test_audit_rpc_idl.py -v
          python scripts/audit-rpc-idl.py
      - name: Remove sidecar and commit verified ledger
        run: |
          rm .github/workflows/den-3959-rpc-ledger-fix-sidecar.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-rpc-idl.py .github/workflows/den-3959-rpc-ledger-fix-sidecar.yml
          git commit -m 'DEN-3959: admit reviewed RPC config TypeSpec declarations'
          git push origin HEAD:den-3959-rpc-ledger-fix-sidecar
