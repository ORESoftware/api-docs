name: http-routing-policy

on:
  pull_request:
    paths:
      - "json-schema/route-map.schema.json"
      - "examples/**"
      - "scripts/audit-http-routing-policy.py"
      - "scripts/test_audit_http_routing_policy.py"
      - ".github/workflows/http-routing-policy.yml"
  push:
    branches: [main]
    paths:
      - "json-schema/route-map.schema.json"
      - "examples/**"
      - "scripts/audit-http-routing-policy.py"
      - "scripts/test_audit_http_routing_policy.py"
      - ".github/workflows/http-routing-policy.yml"

permissions:
  contents: read

concurrency:
  group: http-routing-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 1
      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install exact JSON Schema validator
        run: >-
          python -m pip install --disable-pip-version-check --quiet
          jsonschema==4.25.1
      - name: Run mutation tests
        run: python3 scripts/test_audit_http_routing_policy.py -v
      - name: Audit checked-in v1 route maps
        run: python3 scripts/audit-http-routing-policy.py
