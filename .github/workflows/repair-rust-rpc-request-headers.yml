name: Repair runtime Rust request headers once

on:
  push:
    branches:
      - feat/ridl-v2-typed-request-headers-2026-09-04

permissions:
  contents: write

jobs:
  repair-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact pushed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Repair all handwritten runtime request fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = (
              Path("runtime/rust/opto_sync.rs"),
              Path("runtime/rust/transports.rs"),
              Path("runtime/rust/transport.rs"),
          )
          old = "            query: Vec::new(),\n            body:"
          new = "            query: Vec::new(),\n            headers: Vec::new(),\n            body:"

          for path in files:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one stale RpcRequest initializer, found {count}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Run the failing repository-native Rust gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path runtime/rust/Cargo.toml --check
          cargo test --manifest-path runtime/rust/Cargo.toml --locked

      - name: Remove this one-use workflow and publish the validated repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-rust-rpc-request-headers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- runtime/rust/opto_sync.rs runtime/rust/transports.rs runtime/rust/transport.rs
          git diff --cached --check
          git commit -m 'fix(rust): initialize typed headers in runtime requests'
          git push origin HEAD:feat/ridl-v2-typed-request-headers-2026-09-04
