name: Repair Rust request fixtures for typed headers

on:
  push:
    branches:
      - feat/ridl-v2-typed-request-headers-2026-09-04

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/ridl-v2-typed-request-headers-2026-09-04
          fetch-depth: 0

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Add explicit empty headers to handwritten requests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = (
              "runtime/rust/opto_sync.rs",
              "runtime/rust/transports.rs",
              "runtime/rust/transport.rs",
          )
          old = "            query: Vec::new(),\n            body:"
          new = "            query: Vec::new(),\n            headers: Vec::new(),\n            body:"
          for name in files:
              path = Path(name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{name}: expected one handwritten RpcRequest initializer, found {count}")
              path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Run the permanent Rust admission commands
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path clients/rust/Cargo.toml --check
          cargo clippy --manifest-path clients/rust/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path clients/rust/Cargo.toml --all-targets --all-features
          cargo test --manifest-path clients/rust/Cargo.toml --test openapi_conformance

      - name: Commit validated product files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/rust/opto_sync.rs runtime/rust/transports.rs runtime/rust/transport.rs
          git diff --cached --check
          git commit -m 'fix(rust): initialize typed request headers in runtime fixtures'
          git push origin HEAD:feat/ridl-v2-typed-request-headers-2026-09-04
