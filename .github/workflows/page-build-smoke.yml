name: page-build-smoke

on:
  pull_request:
    paths:
      - "rust/src/fs_codegen.rs"
      - "rust/src/fs_route.rs"
      - "rust/src/module_analysis.rs"
      - "rust/src/page_build.rs"
      - "rust/src/page_router_codegen.rs"
      - "clients/rust/src/page.rs"
      - "macros/rust/**"
      - ".github/workflows/page-build-smoke.yml"
  push:
    branches:
      - DEN-3960-rust-fs-routing
    paths:
      - "rust/src/fs_codegen.rs"
      - "rust/src/fs_route.rs"
      - "rust/src/module_analysis.rs"
      - "rust/src/page_build.rs"
      - "rust/src/page_router_codegen.rs"
      - "clients/rust/src/page.rs"
      - "macros/rust/**"
      - ".github/workflows/page-build-smoke.yml"

permissions:
  contents: read

concurrency:
  group: api-docs-page-build-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
      - name: Compile api-docs page build library
        run: cargo check --manifest-path rust/Cargo.toml --locked
      - name: Test filesystem page routing and build finalization
        run: |
          cargo test --manifest-path rust/Cargo.toml --locked fs_route -- --nocapture
          cargo test --manifest-path rust/Cargo.toml --locked module_analysis -- --nocapture
          cargo test --manifest-path rust/Cargo.toml --locked page_build -- --nocapture
          cargo test --manifest-path rust/Cargo.toml --locked page_router_codegen -- --nocapture

# `ORESoftware/ores-stack` is private. Its consumer compile belongs in that
# repository, where its own workflow has permission to read the source and pin
# the exact public api-docs revision. Do not introduce a cross-repository PAT
# into this shared contract workflow merely to compile a private consumer.
