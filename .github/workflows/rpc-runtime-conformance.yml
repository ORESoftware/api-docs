name: RPC runtime and stream lifecycle conformance

on:
  pull_request:
    paths:
      - "runtime/**"
      - "ridl/framing.py"
      - "examples/frames/conformance.json"
      - "examples/opto-sync/**"
      - "scripts/test_framing.py"
      - "scripts/test_rpc_runtime_manifest.py"
      - ".github/workflows/rpc-runtime-conformance.yml"
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "ridl/framing.py"
      - "examples/frames/conformance.json"
      - "examples/opto-sync/**"
      - "scripts/test_framing.py"
      - "scripts/test_rpc_runtime_manifest.py"
      - ".github/workflows/rpc-runtime-conformance.yml"

permissions:
  contents: read

concurrency:
  group: rpc-runtime-stream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify the closed runtime manifest
        run: python3 scripts/test_rpc_runtime_manifest.py
      - name: Re-run the normative Python fixture suite
        run: python3 scripts/test_framing.py

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
      - name: Compile and test the locked preserve-order runtime
        run: cargo test --manifest-path runtime/rust/Cargo.toml --locked

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          package-manager-cache: false
      - name: Run browser-safe TypeScript byte conformance
        run: node --experimental-strip-types --test runtime/typescript/frame.conformance.test.ts
      - name: Run deferred TypeScript stream lifecycle tests
        run: node --experimental-strip-types --test runtime/typescript/transport.test.ts
      - name: Run the telemetry seam error-path tests
        run: node --experimental-strip-types --test runtime/typescript/telemetry.test.ts

  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Install Dart 3.6.0
        uses: dart-lang/setup-dart@d6a63dab3335f427404425de0fbfed4686d93c4f # v1.7.2
        with:
          sdk: "3.6.0"
      - name: Resolve the isolated Dart runtime
        run: dart pub get
        working-directory: runtime/dart
      - name: Analyze the Flutter-safe runtime
        run: dart analyze --fatal-infos
        working-directory: runtime/dart
      - name: Run Dart byte conformance
        run: dart test
        working-directory: runtime/dart

  gleam:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Install Erlang and Gleam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27.3.4.14"
          gleam-version: "1.14.0"
      - name: Run deferred Gleam stream lifecycle tests
        run: gleam test
        working-directory: runtime/gleam

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Install Go 1.24.7
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.24.7"
          cache: false
      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l runtime/go)"
      - name: Vet the standard-library runtime
        run: go vet ./...
        working-directory: runtime/go
      - name: Run race-enabled Go byte conformance
        run: go test -race ./...
        working-directory: runtime/go
