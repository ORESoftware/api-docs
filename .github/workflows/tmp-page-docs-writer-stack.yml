name: tmp-page-docs-writer-stack

on:
  push:
    branches:
      - feat/web-page-docs-writer-render-chain-20260920
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out stacked branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/web-page-docs-writer-render-chain-20260920
          persist-credentials: true
          fetch-depth: 1
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Wire writer and format
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('rust/src/lib.rs')
          text = p.read_text()
          needle = 'pub mod page_build;\n'
          if 'pub mod page_docs;\n' not in text:
              if text.count(needle) != 1:
                  raise SystemExit('unexpected page_build module declaration count')
              text = text.replace(needle, needle + 'pub mod page_docs;\n', 1)
              p.write_text(text)
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
          changed="$(git diff --name-only | sort)"
          test -n "$changed"
          printf '%s\n' "$changed" | grep -qx 'rust/src/lib.rs'
          while IFS= read -r path; do
            case "$path" in
              rust/src/lib.rs|rust/src/page_docs.rs) ;;
              *) echo "unexpected formatter change: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
      - name: Test page manifest and docs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/Cargo.toml page_manifest --locked
          cargo test --manifest-path rust/Cargo.toml page_docs --locked
          cargo test --manifest-path rust/Cargo.toml page_layout --locked
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Commit verified writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORESoftware automation"
          git config user.email "actions@users.noreply.github.com"
          git add rust/src/lib.rs rust/src/page_docs.rs
          git diff --cached --quiet && exit 0
          git commit -m "feat(web): project render-chain manifest to generated docs"
          git push origin HEAD:feat/web-page-docs-writer-render-chain-20260920
