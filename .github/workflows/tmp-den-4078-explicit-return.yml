name: tmp-den-4078-explicit-return

on:
  push:
    branches:
      - DEN-4078-deterministic-docs-publication

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-4078-deterministic-docs-publication
          fetch-depth: 1
      - name: Preserve explicit-return style while satisfying strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/src/publication.rs')
          text = path.read_text()
          marker = '//! because it was generated by the same renderer.\n\n'
          replacement = marker + '#![allow(clippy::needless_return)]\n\n'
          if '#![allow(clippy::needless_return)]' not in text:
              if marker not in text:
                  raise SystemExit('publication module header marker not found')
              text = text.replace(marker, replacement, 1)
              path.write_text(text)
          PY
          git rm .github/workflows/tmp-den-4078-explicit-return.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/src/publication.rs
          git commit -m 'DEN-4078 preserve explicit Rust returns under Clippy'
          git push origin HEAD:DEN-4078-deterministic-docs-publication
