name: tmp-targeted-unary-flake-fix

on:
  push:
    branches:
      - test/targeted-unary-dedupe-determinism-20260920
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/targeted-unary-dedupe-determinism-20260920
          persist-credentials: true
          fetch-depth: 1
      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Patch flaky dedupe test barrier
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('clients/typescript/src/targeted-unary.test.js')
          text = p.read_text()
          old = '''test("dedupe joins within a target but never across targets", async () => {
            const records = [];
            let releases = [];
            let resolveTwoEntries;
            const twoEntries = new Promise((resolve) => {
              resolveTwoEntries = resolve;
            });
            const client = new OresTargetedRpcUnaryClient({
              baseUrl: "https://api.example.test",
              lambdaBaseUrl: "https://lambda.example.test",
              operations: ["demo.users.find"],
              fetchImpl: async (url, init) => {
                const envelope = JSON.parse(init.body);
                records.push(String(url));
                if (records.length === 2) resolveTwoEntries();
                await new Promise((resolve) => releases.push(resolve));
                return new Response(JSON.stringify(receipt(envelope, { ok: true })), { status: 200 });
              },
            });

            const standaloneA = client.call("demo.users.find", {}, { standalone: true }).dedupe().makeCall();
            const standaloneB = client.call("demo.users.find", {}, { standalone: true }).dedupe().makeCall();
            const lambda = client.call("demo.users.find", {}, { lambda: true }).dedupe().makeCall();

            await Promise.race([
              twoEntries,
              new Promise((_, reject) =>
                setTimeout(() => reject(new Error("standalone and Lambda transports did not both start")), 1000),
              ),
            ]);
            assert.equal(records.length, 2, "standalone duplicates collapse, Lambda stays separate");
            for (const release of releases) release();
            releases = [];
            await Promise.all([standaloneA, standaloneB, lambda]);
          });
          '''
          new = '''test("dedupe joins within a target but never across targets", async () => {
            const records = [];
            let resolveTwoEntries;
            const twoEntries = new Promise((resolve) => {
              resolveTwoEntries = resolve;
            });
            let releaseTransports;
            const transportRelease = new Promise((resolve) => {
              releaseTransports = resolve;
            });
            const client = new OresTargetedRpcUnaryClient({
              baseUrl: "https://api.example.test",
              lambdaBaseUrl: "https://lambda.example.test",
              operations: ["demo.users.find"],
              fetchImpl: async (url, init) => {
                const envelope = JSON.parse(init.body);
                records.push(String(url));
                if (records.length === 2) resolveTwoEntries();
                await transportRelease;
                return new Response(JSON.stringify(receipt(envelope, { ok: true })), { status: 200 });
              },
            });

            const standaloneA = client.call("demo.users.find", {}, { standalone: true }).dedupe().makeCall();
            const standaloneB = client.call("demo.users.find", {}, { standalone: true }).dedupe().makeCall();
            const lambda = client.call("demo.users.find", {}, { lambda: true }).dedupe().makeCall();

            await Promise.race([
              twoEntries,
              new Promise((_, reject) =>
                setTimeout(() => reject(new Error("standalone and Lambda transports did not both start")), 1000),
              ),
            ]);
            assert.equal(records.length, 2, "standalone duplicates collapse, Lambda stays separate");
            releaseTransports();
            await Promise.all([standaloneA, standaloneB, lambda]);
            assert.equal(records.length, 2, "no late transport starts after releasing the barrier");
          });
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one target test block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "clients/typescript/src/targeted-unary.test.js"
      - name: Install TypeScript client dependencies
        run: npm ci --prefix clients/typescript --ignore-scripts --no-audit --no-fund
      - name: Stress targeted test and run full client suite
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 25); do
            node --test clients/typescript/src/targeted-unary.test.js
          done
          npm test --prefix clients/typescript
      - name: Commit verified test hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORESoftware automation"
          git config user.email "actions@users.noreply.github.com"
          git add clients/typescript/src/targeted-unary.test.js
          git commit -m "test(ts): make targeted dedupe barrier deterministic"
          git push origin HEAD:test/targeted-unary-dedupe-determinism-20260920
