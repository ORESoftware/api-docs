name: ores-rpc-config-salvage-regressions

on:
  pull_request:
    paths:
      - ".ores-rpc.toml"
      - "scripts/ores_rpc_config.py"
      - "scripts/test_ores_rpc_config.py"
      - "scripts/test_ores_rpc_config_salvage.py"
      - ".github/workflows/ores-rpc-config-salvage-regressions.yml"
  push:
    branches: [main]
    paths:
      - ".ores-rpc.toml"
      - "scripts/ores_rpc_config.py"
      - "scripts/test_ores_rpc_config.py"
      - "scripts/test_ores_rpc_config_salvage.py"
      - ".github/workflows/ores-rpc-config-salvage-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-rpc-config-salvage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  boundary-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Verify exact candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run canonical and salvaged fail-closed regressions
        run: |
          python3 -m unittest scripts/test_ores_rpc_config.py -v
          python3 -m unittest scripts/test_ores_rpc_config_salvage.py -v
