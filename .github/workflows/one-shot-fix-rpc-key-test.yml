name: one-shot-fix-rpc-key-test

on:
  push:
    branches: [feat/shared-operation-rpc-v1]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/shared-operation-rpc-v1
          token: ${{ github.token }}
      - name: Update stale TypeSpec key assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rust/src/bin/api_docs_check/idl.rs')
          s = p.read_text()
          old = 'Some("^[A-Za-z][A-Za-z0-9_]*$")'
          new = 'Some(r"^(?:[A-Za-z][A-Za-z0-9_]*|[a-z][a-z0-9_-]*(?:\\.[a-z][a-z0-9_-]*)+)$")'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one stale assertion, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          git diff --check
          git diff -- rust/src/bin/api_docs_check/idl.rs
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/src/bin/api_docs_check/idl.rs
          git commit -m 'test(rpc): track canonical dotted operation keys'
          git push origin HEAD:feat/shared-operation-rpc-v1
