name: tmp-pr207-writer-hardening

on:
  push:
    branches:
      - feat/web-page-docs-writer-render-chain-20260920
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/web-page-docs-writer-render-chain-20260920
          persist-credentials: true
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Harden generated-set preflight and rename durability
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('rust/src/page_docs.rs')
          text = p.read_text()
          old = '''    let manifest_path = out_dir.join("page-manifest.json");
              let markdown_path = out_dir.join("pages.md");
              let html_path = out_dir.join("pages.html");

              sync_owned_file(
          '''
          new = '''    let manifest_path = out_dir.join("page-manifest.json");
              let markdown_path = out_dir.join("pages.md");
              let html_path = out_dir.join("pages.html");

              // Admit the complete generated set before mutating the first file. In
              // particular, an authored/unowned later destination must not leave an
              // earlier manifest or docs file updated to a different generation.
              if !check {
                  ensure_confined_parent_dirs(&root, &manifest_path)?;
                  for (path, kind) in [
                      (&manifest_path, OutputKind::Manifest),
                      (&markdown_path, OutputKind::MarkedText),
                      (&html_path, OutputKind::MarkedText),
                  ] {
                      verify_confined_path(&root, path, true)?;
                      let _ = verify_owned_destination(path, kind)?;
                  }
              }

              sync_owned_file(
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one output block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''    if let Err(source) = fs::rename(&temp, path) {
              let _ = fs::remove_file(&temp);
              return Err(WebPageDocsError::Io {
                  path: path.display().to_string(),
                  source,
              });
          }
          Ok(())
          }

          fn confined_relative'''
          new = '''    if let Err(source) = fs::rename(&temp, path) {
              let _ = fs::remove_file(&temp);
              return Err(WebPageDocsError::Io {
                  path: path.display().to_string(),
                  source,
              });
          }
          if let Some(parent) = path.parent() {
              sync_directory(parent)?;
          }
          Ok(())
          }

          fn sync_directory(path: &Path) -> Result<(), WebPageDocsError> {
              fs::File::open(path)
                  .and_then(|directory| directory.sync_all())
                  .map_err(|source| WebPageDocsError::Io {
                      path: path.display().to_string(),
                      source,
                  })
          }

          fn confined_relative'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one rename block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          marker = '''    #[test]
              fn json_ownership_requires_schema_and_fixed_generator_identity() {
          '''
          test = '''    #[test]
              fn later_ownership_refusal_does_not_partially_update_generated_set() {
                  let root = temp_root("set-preflight");
                  let build = fixture(&root);
                  let out = root.join("generated/web");
                  sync_web_page_docs(&root, &build, &out, false).unwrap();
                  let manifest_before = fs::read(out.join("page-manifest.json")).unwrap();

                  fs::write(out.join("pages.md"), "authored and unowned\\n").unwrap();
                  fs::write(
                      root.join("src/pages/users/[id]/page.rs"),
                      "pub async fn page() { /* changed */ }\\n",
                  )
                  .unwrap();

                  let error = sync_web_page_docs(&root, &build, &out, false)
                      .expect_err("later unowned output must reject the whole set before mutation");
                  assert!(matches!(error, WebPageDocsError::Ownership { .. }));
                  assert_eq!(
                      fs::read(out.join("page-manifest.json")).unwrap(),
                      manifest_before,
                      "preflight must prevent an earlier file from advancing generations"
                  );
                  fs::remove_dir_all(root).unwrap();
              }

          '''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one json ownership test marker, found {text.count(marker)}')
          text = text.replace(marker, test + marker, 1)
          p.write_text(text)
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
          test "$(git diff --name-only)" = "rust/src/page_docs.rs"
      - name: Verify focused and full Rust surface
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/Cargo.toml page_docs --locked
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORESoftware automation"
          git config user.email "actions@users.noreply.github.com"
          git add rust/src/page_docs.rs
          git commit -m "fix(web): preflight page docs generated set"
          git push origin HEAD:feat/web-page-docs-writer-render-chain-20260920
