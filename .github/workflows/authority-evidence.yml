name: peer-authority-artifact-evidence

on:
  pull_request:
    paths:
      - "idl/authority-contract.json"
      - "idl/authority-evidence.json"
      - "rust/src/bin/authority_evidence.rs"
      - "scripts/oresc-audit.sh"
      - "scripts/test-oresc-audit.sh"
      - ".github/workflows/authority-evidence.yml"
  push:
    branches: [main]
    paths:
      - "idl/authority-contract.json"
      - "idl/authority-evidence.json"
      - "rust/src/bin/authority_evidence.rs"
      - "scripts/oresc-audit.sh"
      - "scripts/test-oresc-audit.sh"
      - ".github/workflows/authority-evidence.yml"

permissions:
  contents: read

concurrency:
  group: authority-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Syntax-check ores-cli audit entrypoint
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/oresc-audit.sh
          bash -n scripts/test-oresc-audit.sh

      - name: Exercise ores-cli audit wrapper contract
        shell: bash
        run: bash scripts/test-oresc-audit.sh

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0

      - name: Run the repository evidence gate
        run: >-
          cargo run
          --manifest-path rust/Cargo.toml
          --bin authority_evidence
          --locked
          --
          --check

      - name: Run adversarial evidence tests
        run: >-
          cargo test
          --manifest-path rust/Cargo.toml
          --bin authority_evidence
          --locked
