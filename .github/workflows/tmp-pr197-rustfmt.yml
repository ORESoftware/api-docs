name: tmp-pr197-rustfmt

on:
  push:
    branches:
      - feat/web-page-docs-current-main-20260920
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/web-page-docs-current-main-20260920
          persist-credentials: true
          fetch-depth: 1
      - name: Install Rust 1.95.0 with rustfmt
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format only the intended Rust delta
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo "already formatted"
            exit 0
          fi
          test "$changed" = "rust/src/module_analysis.rs"
          git diff --check
          git config user.name "ORESoftware automation"
          git config user.email "actions@users.noreply.github.com"
          git add rust/src/module_analysis.rs
          git commit -m "style(web): apply rustfmt to revalidation boundary test"
          git push origin HEAD:feat/web-page-docs-current-main-20260920
