name: temporary minimal payload codec lockfile

on:
  push:
    branches:
      - feat/payload-codec-runtime-v1

permissions:
  contents: write

jobs:
  minimize-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/payload-codec-runtime-v1
          fetch-depth: 0

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Restore main lockfile, format, lint, and test
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:Cargo.lock > Cargo.lock
          cargo check --manifest-path rust/Cargo.toml --all-features
          cargo fmt --all
          cargo clippy --manifest-path rust/Cargo.toml --all-features --locked -- -D warnings
          cargo test --manifest-path rust/Cargo.toml payload_codec::tests --all-features --locked

      - name: Commit only deterministic branch outputs
        shell: bash
        run: |
          git add Cargo.lock rust/src/lib.rs rust/src/payload_codec.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(rust): format and lock payload codec runtime'
          git push origin HEAD:feat/payload-codec-runtime-v1
