name: tmp-den-4078-land-parser-parity-v4

on:
  push:
    branches:
      - DEN-4078-http-response-framing-projection

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-4078-http-response-framing-projection
          fetch-depth: 1
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Land fail-closed parser parity with regressions
        shell: bash
        run: |
          set -euo pipefail
          macro='macros/operation-rust/src/lib.rs'
          shared='rust/src/shared_operation.rs'

          perl -0pi -e 's#Expr::Lit\(ExprLit \{\s*lit: Lit::Str\(value\),\s*\.\.\s*\}\) => value\.value\(\),#Expr::Lit(ExprLit {\n                    lit: Lit::Str(value),\n                    ..\n                }) => {\n                    syn::parse_str::<syn::Path>(\&value.value()).map_err(|_| {\n                        syn::Error::new_spanned(\n                            value,\n                            "ores_route operation must be a function path such as handlers::find_user",\n                        )\n                    })?;\n                    value.value()\n                },#s' "$macro"

          perl -0pi -e 's#Expr::Lit\(ExprLit \{\s*lit: Lit::Str\(value\),\s*\.\.\s*\}\) => Ok\(value\s*\.value\(\)\s*\.rsplit\("::"\)\s*\.next\(\)\s*\.unwrap_or_default\(\)\s*\.to_owned\(\)\),#Expr::Lit(ExprLit {\n            lit: Lit::Str(value),\n            ..\n        }) => {\n            let source = value.value();\n            let parsed = syn::parse_str::<syn::Path>(\&source).map_err(|_| {\n                invalid_route(\n                    path,\n                    name,\n                    "operation must be a function path such as handlers::find_user",\n                )\n            })?;\n            parsed\n                .segments\n                .last()\n                .map(|segment| segment.ident.to_string())\n                .ok_or_else(|| {\n                    invalid_route(\n                        path,\n                        name,\n                        "operation must be a function path such as handlers::find_user",\n                    )\n                })\n        }#s' "$shared"

          if ! grep -q 'quoted_operation_paths_are_validated' "$macro"; then
            perl -0pi -e 's#(    \#\[test\]\n    fn projection_metadata_is_optional_and_order_independent\(\) \{)#    #[test]\n    fn quoted_operation_paths_are_validated() {\n        let operation = validate_route(\n            \&args(r#"operation = \\"handlers::find_user\\""#),\n            \&adapter("get"),\n        )\n        .expect("valid quoted function path");\n        assert_eq!(operation, "handlers::find_user");\n\n        for value in ["", "handlers::", "not a path", "handlers::find-user"] {\n            let source = format!("operation = {value:?}");\n            let message = error(\&source);\n            assert!(\n                message.contains("must be a function path"),\n                "{source}: {message}"\n            );\n        }\n    }\n\n$1#s' "$macro"
          fi

          if ! grep -q 'quoted_route_operation_paths_match_macro_admission' "$shared"; then
            perl -0pi -e 's#(    \#\[test\]\n    fn duplicate_route_projection_fields_fail_closed\(\) \{)#    #[test]\n    fn quoted_route_operation_paths_match_macro_admission() {\n        let valid = r#"\n            #[ores_operation(key = \\"demo.users.find_user\\")]\n            async fn find_user(ctx: OperationContext, input: Input) -> Output { todo!() }\n\n            #[ores_route(operation = \\"handlers::find_user\\")]\n            pub async fn get() {}\n        "#;\n        analyze_shared_operation_route_source("src/routes/users/route.rs", valid)\n            .expect("valid quoted function path");\n\n        for value in ["", "handlers::", "not a path", "handlers::find-user"] {\n            let source = format!(\n                r#"\n                    #[ores_operation(key = \\"demo.users.find_user\\")]\n                    async fn find_user(ctx: OperationContext, input: Input) -> Output {{ todo!() }}\n                    #[ores_route(operation = {value:?})]\n                    pub async fn get() {{}}\n                "#\n            );\n            let error = analyze_shared_operation_route_source(\n                "src/routes/users/route.rs",\n                \&source,\n            )\n            .expect_err("malformed quoted function path must fail");\n            assert!(\n                format!("{error}").contains("must be a function path"),\n                "{value:?}: {error}"\n            );\n        }\n    }\n\n$1#s' "$shared"
          fi

          grep -Fq 'syn::parse_str::<syn::Path>(&value.value())' "$macro"
          grep -Fq 'let parsed = syn::parse_str::<syn::Path>(&source)' "$shared"
          grep -q 'quoted_operation_paths_are_validated' "$macro"
          grep -q 'quoted_route_operation_paths_match_macro_admission' "$shared"

          cargo fmt --all
          cargo clippy --manifest-path macros/operation-rust/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml --bin api-docs-check --all-features --locked -- -D warnings
          cargo test --manifest-path macros/operation-rust/Cargo.toml quoted_operation_paths_are_validated
          cargo test --manifest-path rust/Cargo.toml --all-features --locked quoted_route_operation_paths_match_macro_admission
          cargo test --manifest-path rust/Cargo.toml --all-features --locked
          cargo test --manifest-path runtime/rust/Cargo.toml --locked
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$macro" "$shared"
          git rm --ignore-unmatch -- \
            .github/tmp/den-4078-route-parser-parity.patch \
            .github/workflows/tmp-den-4078-route-parser-parity.yml \
            .github/workflows/tmp-den-4078-land-parser-parity.yml \
            .github/workflows/tmp-den-4078-land-parser-parity-v2.yml \
            .github/workflows/tmp-den-4078-land-parser-parity-v3.yml \
            .github/workflows/tmp-den-4078-land-parser-parity-v4.yml
          git commit -m 'fix(DEN-4078): align route operation parser admission'
          git push origin HEAD:DEN-4078-http-response-framing-projection
