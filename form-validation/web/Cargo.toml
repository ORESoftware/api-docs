[package]
name = "ores-form-views"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Escaped form-error views for Maud, Leptos and Dioxus"

[workspace]

[features]
default = []
mash = ["dep:maud"]
leptos = ["dep:leptos"]
leptos-ssr = ["leptos", "leptos/ssr"]
dioxus = ["dep:dioxus"]
dioxus-ssr = ["dioxus", "dep:dioxus-ssr"]

[dependencies]
ores-form-validation = { path = "../rust" }
maud = { version = "=0.27.0", optional = true }
leptos = { version = "=0.8.20", default-features = false, optional = true }
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals"], optional = true }
dioxus-ssr = { version = "=0.7.10", optional = true }

[lints.rust]
unsafe_code = "forbid"
