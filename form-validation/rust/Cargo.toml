[package]
name = "ores-form-validation"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Portable, value-free form validation for Rust native and WASM applications"
repository = "https://github.com/ORESoftware/api-docs"
publish = false

# Keep browser/native validation independent from the Axum/docs workspace.
[workspace]

[dependencies]
garde = { version = "=0.23.0", default-features = false, features = ["derive", "email"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# Test-only: no browser runtime or FFI dependency in the production validator.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.78"

[lints.rust]
unsafe_code = "forbid"
