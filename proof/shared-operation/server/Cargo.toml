[package]
name = "ores-rpc-shared-operation-proof-server"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
ores-api-docs = { path = "../../../rust", features = ["axum"] }
ores-api-docs-operation-macros = { path = "../../../macros/operation-rust" }
axum = { version = "0.8", features = ["json"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[lints.rust]
unsafe_code = "forbid"
