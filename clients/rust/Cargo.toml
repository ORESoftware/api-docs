[package]
name = "ores-api-docs-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Client-facing route maps, validated RPC v1 envelopes, framing, and discovery for ORE API docs"
repository = "https://github.com/ORESoftware/api-docs"
readme = "README.md"
publish = false

[dependencies]
# Reuse the contract implementation, without enabling its Axum server adapter.
ores-api-docs = { path = "../../rust", version = "=0.1.0", default-features = false }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
